<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>داکتران - کلینیک دندانپزشکی</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/style.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap');
    
    body {
      font-family: 'Vazirmatn', sans-serif;
      background: linear-gradient(135deg, #f0f4f8 0%, #e6edf7 100%);
      min-height: 100vh;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.7);
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.1);
    }
    .header-gradient {
      background: linear-gradient(135deg, #2c3e50, #1e88e5);
      color: white;
    }
    .doctor-card {
      transition: all 0.3s ease;
    }
    .doctor-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 15px 40px rgba(0,0,0,0.15);
    }
  </style>
</head>
<body class="p-4">

  <div class="header-gradient p-4 rounded-4 mb-4 text-center">
    <h2 class="mb-1 fw-bold">👨‍⚕️ مدیریت داکتران</h2>
    <p class="mb-0">کلینیک دندانپزشکی • افغانستان</p>
  </div>

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4>لیست داکتران</h4>
    <button class="btn btn-success btn-lg" data-bs-toggle="modal" data-bs-target="#doctorModal" onclick="openNewDoctor()">
      <i class="bi bi-plus-circle"></i> اضافه کردن داکتر جدید
    </button>
  </div>

  <div class="row g-4" id="doctorsContainer">
    <!-- کارت‌های داکتران اینجا با JS پر می‌شوند -->
  </div>

  <!-- Modal ثبت / ویرایش داکتر -->
  <div class="modal fade" id="doctorModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content glass-card">
        <div class="modal-header header-gradient">
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          <h5 class="modal-title fw-bold ms-auto" id="modalTitle">ثبت داکتر جدید</h5>
        </div>
        <div class="modal-body p-4">
          <form id="doctorForm">
            <input type="hidden" id="edit_id">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label fw-bold">نام کامل</label>
                <input type="text" class="form-control" id="full_name" required>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-bold">تخصص</label>
                <input type="text" class="form-control" id="specialty" placeholder="دندانپزشک عمومی / متخصص پروتز" required>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-bold">شماره تماس</label>
                <input type="tel" class="form-control" id="phone" placeholder="07xxxxxxxx" required>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-bold">ایمیل</label>
                <input type="email" class="form-control" id="email">
              </div>

              <div class="col-md-6">
                <label class="form-label fw-bold">ساعت شروع کار</label>
                <input type="time" class="form-control" id="start_time" value="08:00">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-bold">ساعت پایان کار</label>
                <input type="time" class="form-control" id="end_time" value="17:00">
              </div>

              <div class="col-12">
                <label class="form-label fw-bold">توضیحات / یادداشت</label>
                <textarea class="form-control" id="notes" rows="3"></textarea>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">انصراف</button>
          <button type="button" class="btn btn-success px-5" onclick="saveDoctor()">ذخیره</button>
        </div>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
// داده نمونه
let doctors = [
  {
    id: 1,
    full_name: "داکتر احمد رحمانی",
    specialty: "دندانپزشک عمومی",
    phone: "0785123456",
    email: "ahmad@clinic.af",
    start_time: "08:00",
    end_time: "17:00",
    notes: "",
    status: "active"
  },
  {
    id: 2,
    full_name: "داکتر فاطمه کریمی",
    specialty: "متخصص پروتز و زیبایی",
    phone: "0791234567",
    email: "fatemeh@clinic.af",
    start_time: "09:00",
    end_time: "18:00",
    notes: "",
    status: "active"
  },
  {
    id: 3,
    full_name: "داکتر محمد نوری",
    specialty: "متخصص عصب‌کشی",
    phone: "0778899001",
    email: "",
    start_time: "08:30",
    end_time: "16:30",
    notes: "",
    status: "active"
  }
];

let editMode = false;

function renderDoctors() {
  const container = document.getElementById('doctorsContainer');
  container.innerHTML = doctors.map(doc => `
    <div class="col-lg-4 col-md-6">
      <div class="glass-card doctor-card p-4 h-100">
        <div class="d-flex align-items-center mb-3">
          <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center" 
               style="width:60px;height:60px;font-size:1.8rem;">
            👨‍⚕️
          </div>
          <div class="ms-3">
            <h5 class="mb-1">${doc.full_name}</h5>
            <small class="text-primary">${doc.specialty}</small>
          </div>
        </div>
        
        <div class="mb-3">
          <div class="mb-1"><i class="bi bi-telephone"></i> <span dir="ltr">${doc.phone}</span></div>
          <div class="mb-1"><i class="bi bi-clock"></i> ${doc.start_time} - ${doc.end_time}</div>
          ${doc.email ? `<div><i class="bi bi-envelope"></i> ${doc.email}</div>` : ''}
        </div>
        
        <span class="badge bg-success mb-3">فعال</span>
        
        <div class="d-flex gap-2">
          <button class="btn btn-sm btn-outline-primary" onclick="editDoctor(${doc.id})">
            <i class="bi bi-pencil"></i> ویرایش
          </button>
          <button class="btn btn-sm btn-outline-danger" onclick="deleteDoctor(${doc.id})">
            <i class="bi bi-trash"></i> حذف
          </button>
        </div>
      </div>
    </div>
  `).join('');
}

function openNewDoctor() {
  editMode = false;
  document.getElementById('modalTitle').textContent = 'ثبت داکتر جدید';
  document.getElementById('doctorForm').reset();
  document.getElementById('edit_id').value = '';
  document.getElementById('start_time').value = '08:00';
  document.getElementById('end_time').value = '17:00';
}

function editDoctor(id) {
  const doctor = doctors.find(d => d.id === id);
  if (!doctor) return;

  editMode = true;
  document.getElementById('modalTitle').textContent = 'ویرایش داکتر';
  document.getElementById('edit_id').value = doctor.id;
  document.getElementById('full_name').value = doctor.full_name;
  document.getElementById('specialty').value = doctor.specialty;
  document.getElementById('phone').value = doctor.phone;
  document.getElementById('email').value = doctor.email || '';
  document.getElementById('start_time').value = doctor.start_time;
  document.getElementById('end_time').value = doctor.end_time;
  document.getElementById('notes').value = doctor.notes || '';

  new bootstrap.Modal(document.getElementById('doctorModal')).show();
}

function saveDoctor() {
  const id = document.getElementById('edit_id').value;
  const data = {
    full_name: document.getElementById('full_name').value,
    specialty: document.getElementById('specialty').value,
    phone: document.getElementById('phone').value,
    email: document.getElementById('email').value,
    start_time: document.getElementById('start_time').value,
    end_time: document.getElementById('end_time').value,
    notes: document.getElementById('notes').value,
    status: 'active'
  };

  if (editMode && id) {
    const index = doctors.findIndex(d => d.id == id);
    if (index !== -1) {
      doctors[index] = { ...doctors[index], ...data };
      alert("✅ اطلاعات داکتر با موفقیت ویرایش شد!");
    }
  } else {
    const newId = doctors.length > 0 ? Math.max(...doctors.map(d => d.id)) + 1 : 1;
    doctors.push({ id: newId, ...data });
    alert("✅ داکتر جدید با موفقیت ثبت شد!");
  }

  bootstrap.Modal.getInstance(document.getElementById('doctorModal')).hide();
  renderDoctors();
}

function deleteDoctor(id) {
  if (confirm("آیا مطمئن هستید که می‌خواهید این داکتر را حذف کنید؟")) {
    doctors = doctors.filter(d => d.id !== id);
    renderDoctors();
    alert("✅ داکتر با موفقیت حذف شد!");
  }
}

// شروع
renderDoctors();
</script>
</body>
</html>
