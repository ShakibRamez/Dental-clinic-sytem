<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>داکتران - کلینیک دندانپزشکی</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap');
    
    body {
      font-family: 'Vazirmatn', sans-serif;
      background: linear-gradient(135deg, #f0f4f8 0%, #e6edf7 100%);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.7);
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.1);
    }
    .doctor-card {
      transition: all 0.3s ease;
    }
    .doctor-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 15px 40px rgba(0,0,0,0.15);
    }
    .header-gradient {
      background: linear-gradient(135deg, #2c3e50, #1e88e5);
      color: white;
    }
  </style>
</head>
<body class="p-4">

  <div class="header-gradient p-4 rounded-4 mb-4 text-center">
    <h2 class="fw-bold mb-1">👨‍⚕️ داکتران کلینیک</h2>
    <p class="mb-0">کلینیک دندانپزشکی • افغانستان</p>
  </div>

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4>لیست داکتران</h4>
    <button class="btn btn-success btn-lg" data-bs-toggle="modal" data-bs-target="#newDoctorModal">
      <i class="bi bi-plus-circle"></i> اضافه کردن داکتر جدید
    </button>
  </div>

  <div class="row g-4" id="doctorsContainer">
    <!-- کارت داکتران با JS پر می‌شود -->
  </div>

  <!-- Modal ثبت داکتر جدید -->
  <div class="modal fade" id="newDoctorModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content glass-card">
        <div class="modal-header header-gradient">
          <h5 class="modal-title fw-bold">ثبت داکتر جدید</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4">
          <form id="doctorForm">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label fw-bold">نام کامل</label>
                <input type="text" class="form-control" id="full_name" required>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-bold">تخصص</label>
                <input type="text" class="form-control" id="specialty" placeholder="دندانپزشک عمومی / متخصص پروتز" required>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-bold">شماره تماس</label>
                <input type="tel" class="form-control" id="phone" placeholder="07xxxxxxxx" required>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-bold">ایمیل (اختیاری)</label>
                <input type="email" class="form-control" id="email">
              </div>

              <div class="col-md-6">
                <label class="form-label fw-bold">ساعت شروع کار</label>
                <input type="time" class="form-control" id="start_time" value="08:00">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-bold">ساعت پایان کار</label>
                <input type="time" class="form-control" id="end_time" value="17:00">
              </div>

              <div class="col-12">
                <label class="form-label fw-bold">توضیحات / یادداشت</label>
                <textarea class="form-control" id="notes" rows="3"></textarea>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">انصراف</button>
          <button type="button" class="btn btn-success px-5" onclick="saveDoctor()">ثبت داکتر</button>
        </div>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
// داده نمونه داکتران
let doctors = [
  {
    id: 1,
    name: "داکتر احمد رحمانی",
    specialty: "دندانپزشک عمومی",
    phone: "0785123456",
    start: "08:00",
    end: "17:00",
    status: "active"
  },
  {
    id: 2,
    name: "داکتر فاطمه کریمی",
    specialty: "متخصص پروتز و زیبایی",
    phone: "0791234567",
    start: "09:00",
    end: "18:00",
    status: "active"
  },
  {
    id: 3,
    name: "داکتر محمد نوری",
    specialty: "متخصص عصب‌کشی",
    phone: "0778899001",
    start: "08:30",
    end: "16:30",
    status: "active"
  }
];

function renderDoctors() {
  const container = document.getElementById('doctorsContainer');
  container.innerHTML = doctors.map(doc => `
    <div class="col-lg-4 col-md-6">
      <div class="glass-card doctor-card p-4 h-100">
        <div class="d-flex align-items-center mb-3">
          <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center" style="width:60px;height:60px;font-size:1.8rem;">
            👨‍⚕️
          </div>
          <div class="ms-3">
            <h5 class="mb-1">${doc.name}</h5>
            <small class="text-primary">${doc.specialty}</small>
          </div>
        </div>
        
        <div class="mb-3">
          <i class="bi bi-telephone"></i> <span dir="ltr">${doc.phone}</span><br>
          <i class="bi bi-clock"></i> ${doc.start} - ${doc.end}
        </div>
        
        <span class="badge bg-success">فعال</span>
        
        <div class="mt-3">
          <button class="btn btn-sm btn-outline-primary me-2" onclick="editDoctor(${doc.id})">ویرایش</button>
          <button class="btn btn-sm btn-outline-info" onclick="viewSchedule(${doc.id})">برنامه کاری</button>
        </div>
      </div>
    </div>
  `).join('');
}

function saveDoctor() {
  alert("✅ داکتر جدید با موفقیت ثبت شد!");
  bootstrap.Modal.getInstance(document.getElementById('newDoctorModal')).hide();
  renderDoctors();
}

function editDoctor(id) {
  alert(`ویرایش اطلاعات داکتر شماره ${id}`);
}

function viewSchedule(id) {
  alert(`مشاهده برنامه کاری داکتر شماره ${id}`);
}

// شروع صفحه
renderDoctors();
</script>
</body>
</html>
