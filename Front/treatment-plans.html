<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پلن درمان - کلینیک دندانپزشکی</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/style.css">
 <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap');
    
    body {
      font-family: 'Vazirmatn', sans-serif;
      background: linear-gradient(135deg, #f0f4f8 0%, #e6edf7 100%);
      min-height: 100vh;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.7);
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.1);
    }
    .header-gradient {
      background: linear-gradient(135deg, #2c3e50, #1e88e5);
      color: white;
    }
    .plan-card {
      transition: all 0.3s;
    }
    .plan-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 15px 40px rgba(0,0,0,0.15);
    }
  </style>
</head>
<body class="p-4">

  <div class="header-gradient p-4 rounded-4 mb-4 text-center">
    <h2 class="mb-1 fw-bold">📋 پلن‌های درمان</h2>
    <p class="mb-0">کلینیک دندانپزشکی • افغانستان</p>
  </div>

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4>پلن‌های فعال مریضان</h4>
    <button class="btn btn-success btn-lg" data-bs-toggle="modal" data-bs-target="#planModal" onclick="openNewPlan()">
      <i class="bi bi-plus-circle"></i> پلن درمان جدید
    </button>
  </div>

  <div class="row g-4" id="plansContainer">
    <!-- کارت‌های پلن اینجا با JS پر می‌شوند -->
  </div>

  <!-- Modal ثبت / ویرایش پلن -->
  <div class="modal fade" id="planModal" tabindex="-1">
    <div class="modal-dialog modal-xl">
      <div class="modal-content glass-card">
        <div class="modal-header header-gradient">
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          <h5 class="modal-title fw-bold ms-auto" id="modalTitle">ایجاد پلن درمان جدید</h5>
        </div>
        <div class="modal-body p-4">
          <form id="planForm">
            <input type="hidden" id="edit_id">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label fw-bold">مریض</label>
                <select class="form-select" id="patient_id" required>
                  <option value="">انتخاب مریض...</option>
                  <option value="1">محمد رحیمی - M-24001</option>
                  <option value="2">فاطمه احمدی - M-24002</option>
                  <option value="3">احمد خان - M-24003</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-bold">عنوان پلن</label>
                <input type="text" class="form-control" id="plan_title" placeholder="مثلاً: ایمپلنت + لمینت" required>
              </div>

              <div class="col-12">
                <label class="form-label fw-bold">توضیحات پلن درمان</label>
                <textarea class="form-control" id="description" rows="3" placeholder="جزئیات مراحل درمان..."></textarea>
              </div>

              <div class="col-md-4">
                <label class="form-label fw-bold">مبلغ کل (؋)</label>
                <input type="number" class="form-control" id="total_amount" placeholder="۰" required>
              </div>
              <div class="col-md-4">
                <label class="form-label fw-bold">تخفیف (؋)</label>
                <input type="number" class="form-control" id="discount" value="0">
              </div>
              <div class="col-md-4">
                <label class="form-label fw-bold">وضعیت</label>
                <select class="form-select" id="status">
                  <option value="active">فعال</option>
                  <option value="completed">تکمیل شده</option>
                  <option value="cancelled">لغو شده</option>
                </select>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">انصراف</button>
          <button type="button" class="btn btn-success px-5" onclick="savePlan()">ذخیره پلن</button>
        </div>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
// داده نمونه
let treatmentPlans = [
  {
    id: 1,
    patient: "محمد رحیمی",
    code: "M-24001",
    title: "ایمپلنت دندان + جرم‌گیری",
    total: 185000,
    paid: 85000,
    status: "active",
    start_date: "۱۴۰۳/۰۲/۱۵"
  },
  {
    id: 2,
    patient: "فاطمه احمدی",
    code: "M-24002",
    title: "لمینت سرامیکی ۸ دندانه",
    total: 320000,
    paid: 320000,
    status: "completed",
    start_date: "۱۴۰۳/۰۱/۲۰"
  },
  {
    id: 3,
    patient: "احمد خان",
    code: "M-24003",
    title: "عصب‌کشی + روکش",
    total: 95000,
    paid: 40000,
    status: "active",
    start_date: "۱۴۰۳/۰۲/۲۵"
  }
];

let editMode = false;

function renderPlans() {
  const container = document.getElementById('plansContainer');
  container.innerHTML = treatmentPlans.map(plan => `
    <div class="col-lg-4 col-md-6">
      <div class="glass-card plan-card p-4 h-100">
        <div class="d-flex justify-content-between align-items-start mb-3">
          <div>
            <strong>${plan.patient}</strong><br>
            <small class="text-muted">${plan.code}</small>
          </div>
          <span class="badge ${plan.status === 'completed' ? 'bg-success' : 'bg-primary'}">
            ${plan.status === 'completed' ? 'تکمیل شده' : 'فعال'}
          </span>
        </div>
        
        <h5 class="mb-3">${plan.title}</h5>
        
        <div class="row text-center mb-3">
          <div class="col-6 border-end">
            <small class="text-muted">مبلغ کل</small><br>
            <strong class="fs-5">${plan.total.toLocaleString('fa-IR')} ؋</strong>
          </div>
          <div class="col-6">
            <small class="text-muted">پرداخت شده</small><br>
            <strong class="fs-5 text-success">${plan.paid.toLocaleString('fa-IR')} ؋</strong>
          </div>
        </div>
        
        <div class="d-flex justify-content-between align-items-center">
          <small>شروع: ${plan.start_date}</small>
          <div>
            <button class="btn btn-sm btn-outline-primary me-1" onclick="editPlan(${plan.id})">ویرایش</button>
            <button class="btn btn-sm btn-outline-danger" onclick="deletePlan(${plan.id})">حذف</button>
          </div>
        </div>
      </div>
    </div>
  `).join('');
}

function openNewPlan() {
  editMode = false;
  document.getElementById('modalTitle').textContent = 'ایجاد پلن درمان جدید';
  document.getElementById('planForm').reset();
  document.getElementById('edit_id').value = '';
  document.getElementById('discount').value = 0;
}

function editPlan(id) {
  const plan = treatmentPlans.find(p => p.id === id);
  if (!plan) return;

  editMode = true;
  document.getElementById('modalTitle').textContent = 'ویرایش پلن درمان';
  document.getElementById('edit_id').value = plan.id;
  
  new bootstrap.Modal(document.getElementById('planModal')).show();
}

function savePlan() {
  alert(editMode ? "✅ پلن درمان با موفقیت ویرایش شد!" : "✅ پلن درمان جدید با موفقیت ثبت شد!");
  bootstrap.Modal.getInstance(document.getElementById('planModal')).hide();
  renderPlans();
}

function deletePlan(id) {
  if (confirm("آیا مطمئن هستید که می‌خواهید این پلن درمان را حذف کنید؟")) {
    treatmentPlans = treatmentPlans.filter(p => p.id !== id);
    renderPlans();
    alert("✅ پلن درمان با موفقیت حذف شد!");
  }
}

// شروع
renderPlans();
</script>
</body>
</html>
