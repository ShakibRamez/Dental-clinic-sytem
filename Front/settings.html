<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تنظیمات سیستم - کلینیک دندانپزشکی</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap');
    
    body {
      font-family: 'Vazirmatn', sans-serif;
      background: linear-gradient(135deg, #f0f4f8 0%, #e6edf7 100%);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.7);
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.1);
    }
    .header-gradient {
      background: linear-gradient(135deg, #2c3e50, #1e88e5);
      color: white;
    }
    .nav-pills .nav-link.active {
      background: #1e88e5;
    }
  </style>
</head>
<body class="p-4">

  <div class="header-gradient p-4 rounded-4 mb-4 text-center">
    <h2 class="fw-bold mb-1">⚙️ تنظیمات سیستم</h2>
    <p class="mb-0">کلینیک دندانپزشکی • افغانستان</p>
  </div>

  <div class="glass-card p-4">
    <ul class="nav nav-pills mb-4" id="settingsTabs">
      <li class="nav-item"><a class="nav-link active" onclick="showTab(0)">اطلاعات کلینیک</a></li>
      <li class="nav-item"><a class="nav-link" onclick="showTab(1)">نوبت‌دهی</a></li>
      <li class="nav-item"><a class="nav-link" onclick="showTab(2)">بک‌آپ</a></li>
      <li class="nav-item"><a class="nav-link" onclick="showTab(3)">ظاهر و نمایش</a></li>
      <li class="nav-item"><a class="nav-link" onclick="showTab(4)">امنیت</a></li>
    </ul>

    <!-- تب ۱: اطلاعات کلینیک -->
    <div class="tab-content" id="tab0">
      <div class="row g-4">
        <div class="col-md-6">
          <label class="form-label fw-bold">نام کلینیک</label>
          <input type="text" class="form-control" value="کلینیک دندانپزشکی امید" id="clinicName">
        </div>
        <div class="col-md-6">
          <label class="form-label fw-bold">شماره تماس کلینیک</label>
          <input type="tel" class="form-control" value="0780123456" id="clinicPhone">
        </div>
        <div class="col-12">
          <label class="form-label fw-bold">آدرس کامل</label>
          <textarea class="form-control" rows="3" id="clinicAddress">هرات ناحیه ۱۰، سرک احمد شاه بابا</textarea>
        </div>
      </div>
    </div>

    <!-- تب ۲: نوبت‌دهی -->
    <div class="tab-content d-none" id="tab1">
      <div class="row g-4">
        <div class="col-md-6">
          <label>مدت زمان هر نوبت (دقیقه)</label>
          <input type="number" class="form-control" value="20">
        </div>
        <div class="col-md-6">
          <label>ساعت شروع کار</label>
          <input type="time" class="form-control" value="08:00">
        </div>
        <div class="col-md-6">
          <label>ساعت پایان کار</label>
          <input type="time" class="form-control" value="17:00">
        </div>
        <div class="col-md-6">
          <label>روزهای تعطیل</label>
          <select class="form-select" multiple>
            <option value="Friday" selected>جمعه</option>
          </select>
        </div>
      </div>
    </div>

    <!-- تب ۳: بک‌آپ -->
    <div class="tab-content d-none" id="tab2">
      <div class="alert alert-info">
        بک‌آپ‌گیری خودکار روزانه فعال است.
      </div>
      <div class="row g-3">
        <div class="col-md-6">
          <label>زمان اجرای خودکار</label>
          <input type="time" class="form-control" value="23:45">
        </div>
        <div class="col-md-6">
          <label>حذف خودکار بک‌آپ‌های قدیمی‌تر از</label>
          <select class="form-select">
            <option>۳۰ روز</option>
            <option selected>۶۰ روز</option>
            <option>۹۰ روز</option>
          </select>
        </div>
      </div>
    </div>

    <!-- تب ۴: ظاهر و نمایش -->
    <div class="tab-content d-none" id="tab3">
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" checked>
        <label class="form-check-label">فعال کردن حالت تاریک (Dark Mode)</label>
      </div>
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" checked>
        <label class="form-check-label">نمایش اعداد به صورت فارسی</label>
      </div>
    </div>

    <!-- تب ۵: امنیت -->
    <div class="tab-content d-none" id="tab4">
      <div class="mb-3">
        <label>تغییر رمز عبور مدیر</label>
        <input type="password" class="form-control" placeholder="رمز عبور جدید">
      </div>
      <button class="btn btn-warning">فعال کردن احراز هویت دو مرحله‌ای</button>
    </div>

    <hr>
    <div class="text-end">
      <button class="btn btn-success px-5" onclick="saveSettings()">ذخیره تغییرات</button>
    </div>
  </div>

<script src="./assets/js/main.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
function showTab(n) {
  document.querySelectorAll('.tab-content').forEach(tab => tab.classList.add('d-none'));
  document.getElementById('tab' + n).classList.remove('d-none');
  
  document.querySelectorAll('#settingsTabs .nav-link').forEach(link => link.classList.remove('active'));
  document.querySelectorAll('#settingsTabs .nav-link')[n].classList.add('active');
}

function saveSettings() {
  alert("✅ تنظیمات با موفقیت ذخیره شد!");
}

// شروع با تب اول
showTab(0);
</script>
</body>
</html>
