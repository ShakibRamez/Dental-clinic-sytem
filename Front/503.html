<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>503 - سیستم در حال تعمیر است</title>
  <script>document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('theme') || 'light')</script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="./assets/css/error.css">
</head>
<body class="err" style="--tone: #0284c7">
  <div class="orbs"><span></span><span></span></div>
  <main class="err-card" role="main">
    <div class="err-icon"><i class="bi bi-tools"></i></div>
    <div class="err-code">503</div>
    <h3 class="err-title">سیستم در حال تعمیر است</h3>
    <p class="err-text">سرویس موقتاً در دسترس نیست (به‌روزرسانی یا نگهداری). اطلاعات شما سالم است و به‌زودی برمی‌گردیم.</p>
<p class="small text-muted"><span class="pulse-dot"></span><span id="st">بررسی خودکار وضعیت سرور هر ۱۵ ثانیه…</span> <b id="sec"></b></p>
    <div class="err-actions"><button class="btn btn-primary" onclick="check()"><i class="bi bi-arrow-clockwise"></i> بررسی دوباره</button><a class="btn btn-outline-secondary" href="index.html"><i class="bi bi-house"></i> صفحهٔ اصلی</a></div>
    <div class="err-meta">
      <span><i class="bi bi-calendar3"></i> <span id="when"></span></span>
      <span><i class="bi bi-link-45deg"></i> <code id="path"></code></span>
      
    </div>
  </main>
<script src="./assets/js/app.js"></script>
<script>
  const $ = id => document.getElementById(id);
  $('when').textContent = AF.long() + ' • ' + AF.time();
  $('path').textContent = location.pathname;
  let s = 15;
  async function check() {
    $('st').textContent = 'در حال بررسی…';
    try { const r = await fetch('index.html', { cache: 'no-store' }); if (r.ok) { $('st').textContent = 'سرور برگشت! در حال انتقال…'; return location.replace('index.html'); } } catch (e) {}
    $('st').textContent = 'هنوز در دسترس نیست. بررسی بعدی تا'; s = 15;
  }
  setInterval(() => { $('sec').textContent = AF.faDigits(s) + ' ثانیه'; if (--s < 0) check(); }, 1000);
</script>
</body>
</html>
