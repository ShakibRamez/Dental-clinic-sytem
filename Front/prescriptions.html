<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نسخه‌نویسی - کلینیک دندانپزشکی</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap');
    
    body {
      font-family: 'Vazirmatn', sans-serif;
      background: linear-gradient(135deg, #f0f4f8 0%, #e6edf7 100%);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.7);
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.1);
    }
    .header-gradient {
      background: linear-gradient(135deg, #2c3e50, #1e88e5);
      color: white;
    }
    .prescription-box {
      border: 2px dashed #0d6efd;
      border-radius: 15px;
      padding: 20px;
      background: #f8f9ff;
    }
  </style>
</head>
<body class="p-4">

  <div class="header-gradient p-4 rounded-4 mb-4 text-center">
    <h2 class="fw-bold mb-1">📝 نسخه‌نویسی داکتر</h2>
    <p class="mb-0">کلینیک دندانپزشکی • افغانستان</p>
  </div>

  <div class="row g-4">
    <div class="col-lg-8">
      <div class="glass-card p-4">
        <h5 class="mb-3">اطلاعات نسخه</h5>
        
        <div class="row g-3 mb-4">
          <div class="col-md-6">
            <label class="form-label fw-bold">نام مریض</label>
            <select class="form-select" id="patientSelect">
              <option value="">انتخاب مریض...</option>
              <option value="1">محمد رحیمی - M-24001</option>
              <option value="2">فاطمه احمدی - M-24002</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-bold">داکتر</label>
            <input type="text" class="form-control" value="داکتر احمد رحمانی" readonly>
          </div>
        </div>

        <div class="prescription-box mb-4">
          <h6 class="mb-3 text-primary">داروها و دستورات</h6>
          
          <div id="drugsList"></div>
          
          <button class="btn btn-outline-primary mt-3" onclick="addDrugRow()">
            <i class="bi bi-plus"></i> اضافه کردن دارو
          </button>
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">دستورات و توصیه‌ها</label>
          <textarea class="form-control" id="instructions" rows="4" placeholder="مثلاً: بعد از غذا مصرف شود، ۷ روز ادامه یابد..."></textarea>
        </div>
      </div>
    </div>

    <!-- پیش‌نمایش نسخه -->
    <div class="col-lg-4">
      <div class="glass-card p-4 sticky-top" style="top:20px">
        <h5 class="mb-3">پیش‌نمایش نسخه</h5>
        <div class="border p-3 bg-white rounded-3" id="previewArea" style="min-height:400px; font-size:0.95rem;">
          <p class="text-center text-muted">پس از افزودن دارو، پیش‌نمایش اینجا نمایش داده می‌شود</p>
        </div>
        
        <div class="mt-4 d-grid gap-2">
          <button class="btn btn-success" onclick="savePrescription()">
            <i class="bi bi-save"></i> ذخیره و چاپ نسخه
          </button>
          <button class="btn btn-outline-secondary" onclick="printPrescription()">
            <i class="bi bi-printer"></i> چاپ نسخه
          </button>
        </div>
      </div>
    </div>
  </div>

<script src="./assets/js/main.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
let drugCounter = 0;

function addDrugRow() {
  drugCounter++;
  const html = `
    <div class="row g-2 mb-3 drug-row" id="drugRow${drugCounter}">
      <div class="col-5">
        <input type="text" class="form-control" placeholder="نام دارو" id="drugName${drugCounter}">
      </div>
      <div class="col-3">
        <input type="text" class="form-control" placeholder="دوز" id="dosage${drugCounter}">
      </div>
      <div class="col-3">
        <input type="text" class="form-control" placeholder="تعداد" id="quantity${drugCounter}">
      </div>
      <div class="col-1">
        <button class="btn btn-danger btn-sm" onclick="removeDrug(${drugCounter})">×</button>
      </div>
    </div>`;
  
  document.getElementById('drugsList').innerHTML += html;
  updatePreview();
}

function removeDrug(id) {
  document.getElementById(`drugRow${id}`).remove();
  updatePreview();
}

function updatePreview() {
  // این تابع بعداً کامل‌تر می‌شود
}

function savePrescription() {
  alert("✅ نسخه با موفقیت ذخیره و ثبت شد!");
}

function printPrescription() {
  alert("🖨️ نسخه برای چاپ ارسال شد (در نسخه کامل به پرینتر متصل می‌شود)");
}

// اولین دارو به صورت پیش‌فرض
window.onload = () => {
  addDrugRow();
};
</script>
</body>
</html>
