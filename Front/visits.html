<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ویزیت‌ها - کلینیک دندانپزشکی</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap');
    
    body {
      font-family: 'Vazirmatn', sans-serif;
      background: linear-gradient(135deg, #f0f4f8 0%, #e6edf7 100%);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.7);
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.1);
    }
    .header-gradient {
      background: linear-gradient(135deg, #2c3e50, #1e88e5);
      color: white;
    }
  </style>
</head>
<body class="p-4">

  <div class="header-gradient p-4 rounded-4 mb-4 text-center">
    <h2 class="fw-bold mb-1">📝 ویزیت‌ها و معاینات</h2>
    <p class="mb-0">کلینیک دندانپزشکی • افغانستان</p>
  </div>

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4>ویزیت‌های اخیر</h4>
    <button class="btn btn-success btn-lg" data-bs-toggle="modal" data-bs-target="#newVisitModal">
      <i class="bi bi-plus-circle"></i> ثبت ویزیت جدید
    </button>
  </div>

  <div class="glass-card p-4">
    <div class="table-responsive">
      <table class="table table-hover align-middle" id="visitsTable">
        <thead>
          <tr>
            <th>تاریخ</th>
            <th>ساعت</th>
            <th>مریض</th>
            <th>داکتر</th>
            <th>دلیل ویزیت</th>
            <th>تشخیص</th>
            <th>وضعیت</th>
            <th>عملیات</th>
          </tr>
        </thead>
        <tbody id="visitsBody"></tbody>
      </table>
    </div>
  </div>

  <!-- Modal ثبت ویزیت جدید -->
  <div class="modal fade" id="newVisitModal" tabindex="-1">
    <div class="modal-dialog modal-xl">
      <div class="modal-content glass-card">
        <div class="modal-header header-gradient">
          <h5 class="modal-title fw-bold">ثبت ویزیت جدید</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4">
          <form id="visitForm">
            <div class="row g-3">
              <div class="col-md-5">
                <label class="form-label fw-bold">مریض</label>
                <select class="form-select" id="patient_id" required>
                  <option value="">انتخاب مریض...</option>
                  <option value="1">محمد رحیمی - M-24001</option>
                  <option value="2">فاطمه احمدی - M-24002</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label fw-bold">داکتر</label>
                <select class="form-select" id="doctor_id" required>
                  <option value="1">داکتر احمد رحمانی</option>
                  <option value="2">داکتر فاطمه کریمی</option>
                </select>
              </div>
              <div class="col-md-3">
                <label class="form-label fw-bold">تاریخ ویزیت</label>
                <input type="date" class="form-control" id="visit_date" required>
              </div>

              <div class="col-md-3">
                <label class="form-label fw-bold">ساعت</label>
                <input type="time" class="form-control" id="visit_time" required>
              </div>

              <div class="col-md-9">
                <label class="form-label fw-bold">دلیل ویزیت / شکایت اصلی</label>
                <input type="text" class="form-control" id="reason" placeholder="درد دندان، جرم‌گیری، معاینه دوره‌ای..." required>
              </div>

              <div class="col-12">
                <label class="form-label fw-bold">تشخیص داکتر</label>
                <textarea class="form-control" id="diagnosis" rows="3" placeholder="مثلاً: پوسیدگی عمیق دندان ۴۶..."></textarea>
              </div>

              <div class="col-12">
                <label class="form-label fw-bold">نکات و دستورات</label>
                <textarea class="form-control" id="notes" rows="3"></textarea>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">انصراف</button>
          <button type="button" class="btn btn-success px-5" onclick="saveVisit()">ثبت ویزیت</button>
        </div>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
// داده نمونه ویزیت‌ها
let visits = [
  {
    id: 1,
    date: "۱۴۰۳/۰۲/۲۸",
    time: "۱۰:۳۰",
    patient: "محمد رحیمی",
    doctor: "داکتر احمد رحمانی",
    reason: "درد شدید دندان",
    diagnosis: "پوسیدگی عمیق + نیاز به عصب‌کشی",
    status: "completed"
  },
  {
    id: 2,
    date: "۱۴۰۳/۰۲/۲۸",
    time: "۱۱:۴۵",
    patient: "فاطمه احمدی",
    doctor: "داکتر فاطمه کریمی",
    reason: "جرم‌گیری و تمیزکاری",
    diagnosis: "التهاب لثه خفیف",
    status: "in_progress"
  },
  {
    id: 3,
    date: "۱۴۰۳/۰۲/۲۷",
    time: "۰۹:۰۰",
    patient: "احمد خان",
    doctor: "داکتر احمد رحمانی",
    reason: "معاینه دوره‌ای",
    diagnosis: "سالم",
    status: "completed"
  }
];

function renderVisits() {
  const tbody = document.getElementById('visitsBody');
  tbody.innerHTML = visits.map(v => `
    <tr>
      <td>${v.date}</td>
      <td><strong>${v.time}</strong></td>
      <td>${v.patient}</td>
      <td>${v.doctor}</td>
      <td>${v.reason}</td>
      <td>${v.diagnosis}</td>
      <td>
        <span class="badge ${v.status === 'completed' ? 'bg-success' : 'bg-warning'}">
          ${v.status === 'completed' ? 'تکمیل شده' : 'در حال انجام'}
        </span>
      </td>
      <td>
        <button class="btn btn-sm btn-outline-primary" onclick="viewVisit(${v.id})">جزئیات</button>
      </td>
    </tr>
  `).join('');
}

function saveVisit() {
  alert("✅ ویزیت با موفقیت ثبت شد!");
  bootstrap.Modal.getInstance(document.getElementById('newVisitModal')).hide();
  renderVisits();
}

function viewVisit(id) {
  alert(`مشاهده جزئیات ویزیت شماره ${id}`);
}

// شروع صفحه
renderVisits();
</script>
</body>
</html>
