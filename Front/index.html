<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>کلینیک دندانپزشکی - سیستم مدیریت</title>
    <script>
      document.documentElement.setAttribute(
        "data-bs-theme",
        localStorage.getItem("theme") || "light",
      );
    </script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/css/style.css" />
    <style>
      html,
      body {
        height: 100%;
        overflow: hidden;
      }
      .shell {
        display: flex;
        height: 100%;
      }
      .sidebar {
        width: 264px;
        flex: none;
        display: flex;
        flex-direction: column;
      }
      .sidebar .nav {
        flex: 1;
        overflow-y: auto;
      }
      .content {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .topbar {
        display: none;
      }
      iframe {
        border: 0;
        width: 100%;
        flex: 1;
        background: transparent;
      }
      @media (max-width: 991.98px) {
        .sidebar {
          position: fixed;
          inset-block: 0;
          inset-inline-start: 0;
          z-index: 1045;
          transform: translateX(100%);
          transition: transform 0.3s;
        }
        .sidebar.open {
          transform: none;
        }
        .topbar {
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 10px 14px;
          background: var(--card);
          color: var(--ink);
          border-bottom: 1px solid var(--line);
        }
        .backdrop {
          position: fixed;
          inset: 0;
          background: rgba(15, 23, 42, 0.4);
          z-index: 1040;
          display: none;
        }
        .backdrop.show {
          display: block;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar p-3" id="sidebar" aria-label="منوی اصلی">
        <div class="d-flex align-items-center gap-3 mb-4 px-1 pt-1">
          <div class="brand-mark"><i class="bi bi-heart-pulse-fill"></i></div>
          <div class="lh-sm">
            <div class="fw-bold">کلینیک دندانپزشکی</div>
            <small class="text-muted">سیستم مدیریت</small>
          </div>
        </div>
        <ul class="nav flex-column list-unstyled" id="nav">
          <li>
            <a href="dashboard.html" class="nav-link active"
              ><i class="bi bi-speedometer2"></i> داشبورد</a
            >
          </li>
          <li>
            <a href="patients2.html" class="nav-link"
              ><i class="bi bi-people"></i> مریضان</a
            >
          </li>
          <li>
            <a href="doctors2.html" class="nav-link"
              ><i class="bi bi-person-badge"></i> داکتران</a
            >
          </li>
          <li>
            <a href="appointments.html" class="nav-link"
              ><i class="bi bi-calendar-check"></i> نوبت‌دهی</a
            >
          </li>
          <li>
            <a href="visits.html" class="nav-link"
              ><i class="bi bi-clipboard2-pulse"></i> ویزیت‌ها</a
            >
          </li>
          <li>
            <a href="prescriptions.html" class="nav-link"
              ><i class="bi bi-prescription2"></i> نسخه‌نویسی</a
            >
          </li>
          <li>
            <a href="treatment-plans.html" class="nav-link"
              ><i class="bi bi-card-checklist"></i> پلن درمان</a
            >
          </li>
          <li>
            <a href="invoices.html" class="nav-link"
              ><i class="bi bi-receipt"></i> فاکتورها</a
            >
          </li>
          <li>
            <a href="inventory.html" class="nav-link"
              ><i class="bi bi-box-seam"></i> انبار</a
            >
          </li>
          <li>
            <a href="reports.html" class="nav-link"
              ><i class="bi bi-bar-chart-line"></i> گزارشات</a
            >
          </li>
          <li>
            <a href="backups.html" class="nav-link"
              ><i class="bi bi-cloud-arrow-up"></i> بک‌آپ</a
            >
          </li>
          <li>
            <a href="users.html" class="nav-link"
              ><i class="bi bi-person-gear"></i> کاربران</a
            >
          </li>
          <li>
            <a href="settings.html" class="nav-link"
              ><i class="bi bi-gear"></i> تنظیمات</a
            >
          </li>
        </ul>
        <div class="pt-3 mt-2" style="border-top: 1px solid var(--line)">
          <div class="d-flex align-items-center gap-2 mb-3">
            <i class="bi bi-person-circle fs-3 text-muted"></i>
            <div class="small lh-sm">
              <span class="text-muted">خوش آمدید</span><br /><strong
                id="currentUser"
              ></strong>
            </div>
          </div>
          <div class="d-flex gap-2">
            <button
              class="btn btn-outline-secondary btn-sm flex-grow-1"
              onclick="logout()"
            >
              <i class="bi bi-box-arrow-right"></i> خروج
            </button>
            <button
              class="btn btn-outline-secondary btn-sm"
              id="themeBtn"
              title="تغییر تم"
              aria-label="تغییر تم"
            >
              <i class="bi bi-moon-stars"></i>
            </button>
          </div>
        </div>
      </aside>
      <div class="backdrop" id="backdrop"></div>

      <main class="content">
        <div class="topbar">
          <button
            class="btn btn-sm btn-outline-secondary"
            id="menuBtn"
            aria-label="منو"
          >
            <i class="bi bi-list fs-5"></i>
          </button>
          <strong id="pageTitle">داشبورد</strong>
          <span style="width: 38px"></span>
        </div>
        <iframe
          name="contentFrame"
          id="frame"
          src="dashboard.html"
          title="محتوای صفحه"
        ></iframe>
      </main>
    </div>

    <script src="assets/js/app.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const $ = (s) => document.querySelector(s),
        links = [...document.querySelectorAll("#nav .nav-link")];
      const frame = $("#frame"),
        sidebar = $("#sidebar"),
        backdrop = $("#backdrop");
      $("#currentUser").textContent = getCurrentUser().full_name;
      

      const toggleMenu = (open) => {
        sidebar.classList.toggle("open", open);
        backdrop.classList.toggle("show", open);
      };
      $("#menuBtn").onclick = () => toggleMenu(true);
      backdrop.onclick = () => toggleMenu(false);

      function go(href) {
        frame.src = href;
        sessionStorage.setItem("lastPage", href);
        history.replaceState(null, "", "#" + href.replace(".html", ""));
      }
      links.forEach((a) =>
        a.addEventListener("click", (e) => {
          e.preventDefault();
          go(a.getAttribute("href"));
          toggleMenu(false);
        }),
      );

      // sync active link + title with whatever the iframe currently shows (also covers in-page navigation)
      frame.addEventListener("load", () => {
        let file = "dashboard.html";
        try {
          file = frame.contentWindow.location.pathname.split("/").pop() || file;
        } catch (e) {}
        links.forEach((a) =>
          a.classList.toggle("active", a.getAttribute("href") === file),
        );
        const cur = links.find((a) => a.getAttribute("href") === file);
        if (cur) $("#pageTitle").textContent = cur.textContent.trim();
      });

      // restore deep link (#patients2) or last page
      const hash = location.hash.slice(1);
      const start =
        links
          .find((a) => a.getAttribute("href") === hash + ".html")
          ?.getAttribute("href") || sessionStorage.getItem("lastPage");
      if (start) frame.src = start;

      // theme
      const icon = () =>
        ($("#themeBtn i").className =
          "bi bi-" +
          (localStorage.getItem("theme") === "dark" ? "sun" : "moon-stars"));
      $("#themeBtn").onclick = () => {
        toggleTheme();
        icon();
      };
      icon();
    </script>
  </body>
</html>
