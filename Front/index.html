<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>کلینیک دندانپزشکی - سیستم مدیریت</title>
  <script>document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('theme') || 'light')</script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/style.css">
  <style>
    html, body { height: 100%; overflow: hidden; }
    .shell { display: flex; height: 100%; }
    .sidebar { width: 248px; flex: none; display: flex; flex-direction: column; transition: width .22s ease; overflow: hidden; }
    .side-head { display: flex; align-items: center; gap: 12px; padding: 14px 16px 8px; min-height: 64px; }
    .brand-text { white-space: nowrap; flex: 1; min-width: 0; }
    .collapse-btn { border: 0; background: none; color: var(--muted); width: 32px; height: 32px; border-radius: 8px; flex: none; }
    .collapse-btn:hover { background: var(--bg); color: var(--ink); }
    .side-nav { flex: 1; overflow-y: auto; padding: 4px 12px 12px; scrollbar-width: thin; }
    .group-label { font-size: .7rem; font-weight: 600; color: var(--muted); opacity: .8; padding: 10px 12px 4px; white-space: nowrap; }
    .side-nav .nav-link { white-space: nowrap; padding: 5px 12px; margin: 1px 0; font-size: .9rem; }
    .side-nav .group-label:first-child { display: none; }
    .side-foot { padding: 12px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 8px; justify-content: space-between; }
    .user-row { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
    .avatar { width: 36px; height: 36px; border-radius: 50%; flex: none; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-strong); font-size: 1.1rem; }
    .user-text { min-width: 0; font-size: .85rem; }
    .foot-btns { display: flex; gap: 6px; flex: none; }
    .foot-btns .btn { width: 34px; height: 34px; padding: 0; display: grid; place-items: center; }
    .content { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .topbar { display: none; }
    iframe { border: 0; width: 100%; flex: 1; background: transparent; }

    /* collapsed rail (desktop) */
    .shell.collapsed .sidebar { width: 76px; }
    .shell.collapsed .brand-text, .shell.collapsed .group-label, .shell.collapsed .nav-link span, .shell.collapsed .user-text { display: none; }
    .shell.collapsed .side-head { flex-direction: column; padding: 14px 0 8px; gap: 8px; }
    .shell.collapsed .nav-link { justify-content: center; padding: 9px 0; }
    .shell.collapsed .side-nav { padding: 4px 10px; }
    .shell.collapsed .side-nav .group-label + .nav-link { margin-top: 0; }
    .shell.collapsed .side-foot { flex-direction: column; padding: 10px 0; }
    .shell.collapsed .user-row { flex: none; }
    .shell.collapsed .foot-btns { flex-direction: column; }

    @media (max-width: 991.98px) {
      .sidebar { position: fixed; inset-block: 0; inset-inline-start: 0; z-index: 1045; width: 280px !important; transform: translateX(100%); transition: transform .28s; box-shadow: 0 0 40px rgba(15,23,42,.2); }
      .sidebar.open { transform: none; }
      .collapse-btn { display: none; }
      .shell.collapsed .brand-text, .shell.collapsed .group-label, .shell.collapsed .nav-link span, .shell.collapsed .user-text { display: revert; }
      .shell.collapsed .side-head { flex-direction: row; padding: 18px 16px 14px; }
      .shell.collapsed .nav-link { justify-content: flex-start; padding: 9px 12px; }
      .shell.collapsed .side-foot, .shell.collapsed .foot-btns { flex-direction: row; }
      .topbar { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: var(--card); color: var(--ink); border-bottom: 1px solid var(--line); }
      .backdrop { position: fixed; inset: 0; background: rgba(15,23,42,.4); z-index: 1040; display: none; }
      .backdrop.show { display: block; }
    }
  </style>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar" aria-label="منوی اصلی">
    <div class="side-head">
      <div class="brand-mark"><i class="bi bi-heart-pulse-fill"></i></div>
      <div class="brand-text lh-sm"><div class="fw-bold">کلینیک دندانپزشکی</div><small class="text-muted">سیستم مدیریت</small></div>
      <button class="collapse-btn" id="collapseBtn" title="جمع کردن منو" aria-label="جمع کردن منو"><i class="bi bi-layout-sidebar-inset-reverse"></i></button>
    </div>
    <nav class="side-nav" id="nav">
      <div class="group-label">اصلی</div>
      <a href="dashboard.html" class="nav-link" title="داشبورد"><i class="bi bi-speedometer2"></i><span>داشبورد</span></a>
      <a href="appointments.html" class="nav-link" title="نوبت‌دهی"><i class="bi bi-calendar-check"></i><span>نوبت‌دهی</span></a>
      <a href="patients2.html" class="nav-link" title="مریضان"><i class="bi bi-people"></i><span>مریضان</span></a>
      <a href="doctors2.html" class="nav-link" title="داکتران"><i class="bi bi-person-badge"></i><span>داکتران</span></a>
      <div class="group-label">درمان</div>
      <a href="visits.html" class="nav-link" title="ویزیت‌ها"><i class="bi bi-clipboard2-pulse"></i><span>ویزیت‌ها</span></a>
      <a href="prescriptions.html" class="nav-link" title="نسخه‌نویسی"><i class="bi bi-prescription2"></i><span>نسخه‌نویسی</span></a>
      <a href="treatment-plans.html" class="nav-link" title="پلن درمان"><i class="bi bi-card-checklist"></i><span>پلن درمان</span></a>
      <div class="group-label">مالی و انبار</div>
      <a href="invoices.html" class="nav-link" title="فاکتورها"><i class="bi bi-receipt"></i><span>فاکتورها</span></a>
      <a href="inventory.html" class="nav-link" title="انبار"><i class="bi bi-box-seam"></i><span>انبار</span></a>
      <a href="reports.html" class="nav-link" title="گزارشات"><i class="bi bi-bar-chart-line"></i><span>گزارشات</span></a>
      <div class="group-label">سیستم</div>
      <a href="users.html" class="nav-link" title="کاربران"><i class="bi bi-person-gear"></i><span>کاربران</span></a>
      <a href="backups.html" class="nav-link" title="بک‌آپ"><i class="bi bi-cloud-arrow-up"></i><span>بک‌آپ</span></a>
      <a href="settings.html" class="nav-link" title="تنظیمات"><i class="bi bi-gear"></i><span>تنظیمات</span></a>
      <a href="about.html" class="nav-link" title="معرفی سیستم"><i class="bi bi-info-circle"></i><span>معرفی سیستم</span></a>
    </nav>
    <div class="side-foot">
      <div class="user-row">
        <div class="avatar"><i class="bi bi-person-fill"></i></div>
        <div class="user-text lh-sm"><small class="text-muted">خوش آمدید</small><div class="fw-semibold text-truncate" id="currentUser"></div></div>
      </div>
      <div class="foot-btns">
        <button class="btn btn-outline-secondary btn-sm" id="themeBtn" title="تغییر تم" aria-label="تغییر تم"><i class="bi bi-moon-stars"></i></button>
        <button class="btn btn-outline-secondary btn-sm" onclick="logout()" title="خروج" aria-label="خروج"><i class="bi bi-box-arrow-right"></i></button>
      </div>
    </div>
  </aside>
  <div class="backdrop" id="backdrop"></div>

  <main class="content">
    <div class="topbar">
      <button class="btn btn-sm btn-outline-secondary" id="menuBtn" aria-label="منو"><i class="bi bi-list fs-5"></i></button>
      <strong id="pageTitle">داشبورد</strong>
      <span style="width:38px"></span>
    </div>
    <iframe name="contentFrame" id="frame" src="dashboard.html" title="محتوای صفحه"></iframe>
  </main>
</div>

<script src="assets/js/app.js"></script>
<script src="assets/js/auth.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const $ = s => document.querySelector(s), links = [...document.querySelectorAll('#nav .nav-link')];
  const frame = $('#frame'), sidebar = $('#sidebar'), backdrop = $('#backdrop');
  $('#currentUser').textContent = getCurrentUser();
  links.forEach((a, i) => a.style.setProperty('--i', i));

  const toggleMenu = open => { sidebar.classList.toggle('open', open); backdrop.classList.toggle('show', open); };
  $('#menuBtn').onclick = () => toggleMenu(true);
  backdrop.onclick = () => toggleMenu(false);

  function go(href) {
    frame.src = href;
    sessionStorage.setItem('lastPage', href);
    history.replaceState(null, '', '#' + href.replace('.html', ''));
  }
  links.forEach(a => a.addEventListener('click', e => { e.preventDefault(); go(a.getAttribute('href')); toggleMenu(false); }));

  // sync active link + title with whatever the iframe currently shows (also covers in-page navigation)
  frame.addEventListener('load', () => {
    let file = 'dashboard.html';
    try { file = frame.contentWindow.location.pathname.split('/').pop() || file; } catch (e) {}
    links.forEach(a => a.classList.toggle('active', a.getAttribute('href') === file));
    const cur = links.find(a => a.getAttribute('href') === file);
    if (cur) $('#pageTitle').textContent = cur.textContent.trim();
  });

  // #hash → صفحه (کارت‌های صفحهٔ معرفی، لینک مستقیم، دکمهٔ برگشت)
  const fromHash = () => links.find(a => a.getAttribute('href') === location.hash.slice(1) + '.html')?.getAttribute('href');
  window.addEventListener('hashchange', () => { const h = fromHash(); if (h && !frame.src.endsWith('/' + h)) { frame.src = h; sessionStorage.setItem('lastPage', h); toggleMenu(false); } });

  // restore deep link (#patients2) or last page
  const hash = location.hash.slice(1);
  const start = links.find(a => a.getAttribute('href') === hash + '.html')?.getAttribute('href') || sessionStorage.getItem('lastPage');
  if (start) frame.src = start;

  // collapse (desktop) — remembered
  const shell = document.querySelector('.shell');
  if (localStorage.getItem('sideCollapsed') === '1') shell.classList.add('collapsed');
  $('#collapseBtn').onclick = () => localStorage.setItem('sideCollapsed', shell.classList.toggle('collapsed') ? '1' : '0');

  // theme
  const icon = () => $('#themeBtn i').className = 'bi bi-' + (localStorage.getItem('theme') === 'dark' ? 'sun' : 'moon-stars');
  $('#themeBtn').onclick = () => { toggleTheme(); icon(); };
  icon();
</script>
</body>
</html>
