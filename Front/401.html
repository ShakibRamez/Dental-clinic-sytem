<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>401 - ورود شما لازم است</title>
  <script>document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('theme') || 'light')</script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="./assets/css/error.css">
</head>
<body class="err" style="--tone: #2563eb">
  <div class="orbs"><span></span><span></span></div>
  <main class="err-card" role="main">
    <div class="err-icon"><i class="bi bi-person-lock"></i></div>
    <div class="err-code">401</div>
    <h3 class="err-title">ورود شما لازم است</h3>
    <p class="err-text">برای دیدن این صفحه باید وارد سیستم شوید. نشست شما ممکن است تمام شده باشد.</p>
<p class="small text-muted" id="cd"><span class="pulse-dot"></span>انتقال خودکار به صفحهٔ ورود تا <b id="sec">۸</b> ثانیه دیگر…</p>
    <div class="err-actions"><a class="btn btn-primary" href="login.html"><i class="bi bi-box-arrow-in-left"></i> ورود به سیستم</a><a class="btn btn-outline-secondary" href="/index"><i class="bi bi-house"></i> صفحهٔ اصلی</a></div>
    <div class="err-meta">
      <span><i class="bi bi-calendar3"></i> <span id="when"></span></span>
      <span><i class="bi bi-link-45deg"></i> <code id="path"></code></span>
      
    </div>
  </main>
<script src="./assets/js/app.js"></script>
<script>
  const $ = id => document.getElementById(id);
  $('when').textContent = AF.long() + ' • ' + AF.time();
  $('path').textContent = location.pathname;
  let s = 8; const t = setInterval(() => { $('sec').textContent = AF.faDigits(--s); if (s <= 0) { clearInterval(t); location.replace('login.html'); } }, 1000);
</script>
</body>
</html>
