<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>گزارشات - کلینیک دندانپزشکی</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap');
    
    body {
      font-family: 'Vazirmatn', sans-serif;
      background: linear-gradient(135deg, #f0f4f8 0%, #e6edf7 100%);
      min-height: 100vh;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.1);
    }
    .header-gradient {
      background: linear-gradient(135deg, #2c3e50, #1e88e5);
      color: white;
    }
    .stat-card {
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      height: 100%;
    }
    .stat-number {
      font-size: 1.8rem;
      font-weight: 700;
    }
  </style>
</head>
<body class="p-4">

  <div class="header-gradient p-4 rounded-4 mb-4 text-center">
    <h2 class="mb-1 fw-bold">📊 گزارشات و آمار کلینیک</h2>
    <p class="mb-0">کلینیک دندانپزشکی • افغانستان</p>
  </div>

  <!-- فیلتر دوره -->
  <div class="glass-card p-3 mb-4">
    <div class="row g-3 align-items-center">
      <div class="col-md-3">
        <select class="form-select" id="reportPeriod">
          <option value="daily">روزانه</option>
          <option value="weekly">هفتگی</option>
          <option value="monthly" selected>ماهانه</option>
          <option value="yearly">سالانه</option>
        </select>
      </div>
      <div class="col-md-3">
        <input type="month" class="form-control" id="reportMonth" value="2025-05">
      </div>
      <div class="col-md-3">
        <button class="btn btn-primary w-100" onclick="generateReports()">
          <i class="bi bi-arrow-clockwise"></i> تولید گزارش
        </button>
      </div>
    </div>
  </div>

  <!-- آمار اصلی -->
  <div class="row g-3 mb-4">
    <div class="col-xl-3 col-md-6">
      <div class="glass-card stat-card">
        <h6 class="text-muted">درآمد این ماه</h6>
        <div class="stat-number text-success">۱,۲۶۰,۰۰۰ ؋</div>
        <small class="text-success">↑ ۲۳٪ نسبت به ماه قبل</small>
      </div>
    </div>
    <div class="col-xl-3 col-md-6">
      <div class="glass-card stat-card">
        <h6 class="text-muted">تعداد ویزیت</h6>
        <div class="stat-number text-primary">۸۴</div>
        <small>این ماه</small>
      </div>
    </div>
    <div class="col-xl-3 col-md-6">
      <div class="glass-card stat-card">
        <h6 class="text-muted">مریض جدید</h6>
        <div class="stat-number text-info">۲۹</div>
        <small>این ماه</small>
      </div>
    </div>
    <div class="col-xl-3 col-md-6">
      <div class="glass-card stat-card">
        <h6 class="text-muted">میانگین رضایت</h6>
        <div class="stat-number text-warning">۹۴٪</div>
        <small>بر اساس بازخورد</small>
      </div>
    </div>
  </div>

  <div class="row g-4">
    <!-- نمودار درآمد -->
    <div class="col-xl-8">
      <div class="glass-card p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h5 class="mb-0">روند درآمد ماهانه</h5>
          <small class="text-muted">سال ۱۴۰۳</small>
        </div>
        <div style="height: 350px;">
          <canvas id="revenueChart"></canvas>
        </div>
      </div>
    </div>

    <!-- پرفروش‌ترین درمان‌ها -->
    <div class="col-xl-4">
      <div class="glass-card p-4 h-100">
        <h5 class="mb-3">پرفروش‌ترین درمان‌ها</h5>
        <div id="topTreatments"></div>
      </div>
    </div>
  </div>

  <!-- ردیف دوم گزارشات -->
  <div class="row g-4 mt-2">
    <!-- وضعیت پرداخت فاکتورها -->
    <div class="col-md-6">
      <div class="glass-card p-4">
        <h5 class="mb-3">وضعیت پرداخت فاکتورها</h5>
        <div style="height: 280px;">
          <canvas id="paymentChart"></canvas>
        </div>
      </div>
    </div>

    <!-- عملکرد داکتران -->
    <div class="col-md-6">
      <div class="glass-card p-4">
        <h5 class="mb-3">عملکرد داکتران (تعداد ویزیت)</h5>
        <div style="height: 280px;">
          <canvas id="doctorChart"></canvas>
        </div>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
// نمودار درآمد
new Chart(document.getElementById('revenueChart'), {
  type: 'bar',
  data: {
    labels: ['حمل', 'ثور', 'جوزا', 'سرطان', 'اسد', 'سنبله', 'میزان'],
    datasets: [{
      label: 'درآمد (هزار افغانی)',
      data: [845, 920, 780, 1100, 950, 1250, 1380],
      backgroundColor: '#1e88e5',
      borderRadius: 8
    }]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    plugins: { legend: { display: false } },
    scales: {
      y: { beginAtZero: true }
    }
  }
});

// نمودار وضعیت پرداخت
new Chart(document.getElementById('paymentChart'), {
  type: 'doughnut',
  data: {
    labels: ['پرداخت شده', 'پرداخت نشده'],
    datasets: [{
      data: [68, 32],
      backgroundColor: ['#28a745', '#ffc107']
    }]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: { position: 'bottom' }
    }
  }
});

// نمودار عملکرد داکتران
new Chart(document.getElementById('doctorChart'), {
  type: 'bar',
  data: {
    labels: ['داکتر احمد', 'داکتر فاطمه', 'داکتر محمد'],
    datasets: [{
      label: 'تعداد ویزیت',
      data: [42, 28, 14],
      backgroundColor: ['#3b82f6', '#8b5cf6', '#06b6d4'],
      borderRadius: 8
    }]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    plugins: { legend: { display: false } },
    scales: {
      y: { beginAtZero: true }
    }
  }
});

// پرفروش‌ترین درمان‌ها
const treatments = [
  {name: "جرم‌گیری", count: 32, percent: 28},
  {name: "عصب‌کشی", count: 24, percent: 21},
  {name: "لمینت", count: 18, percent: 16},
  {name: "ایمپلنت", count: 12, percent: 11},
  {name: "پر کردن", count: 15, percent: 13}
];

document.getElementById('topTreatments').innerHTML = treatments.map(t => `
  <div class="d-flex justify-content-between align-items-center py-2 border-bottom">
    <div>
      <strong>${t.name}</strong><br>
      <small class="text-muted">${t.count} مورد</small>
    </div>
    <span class="badge bg-primary">${t.percent}%</span>
  </div>
`).join('');

function generateReports() {
  alert("✅ گزارشات با موفقیت به‌روزرسانی شد!");
}
</script>
</body>
</html>
