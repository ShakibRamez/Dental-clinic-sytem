<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>گزارشات - کلینیک دندانپزشکی</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap');
    
    body {
      font-family: 'Vazirmatn', sans-serif;
      background: linear-gradient(135deg, #f0f4f8 0%, #e6edf7 100%);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.7);
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.1);
    }
    .header-gradient {
      background: linear-gradient(135deg, #2c3e50, #1e88e5);
      color: white;
    }
  </style>
</head>
<body class="p-4">

  <div class="header-gradient p-4 rounded-4 mb-4 text-center">
    <h2 class="fw-bold mb-1">📊 گزارشات و آمار کلینیک</h2>
    <p class="mb-0">کلینیک دندانپزشکی • افغانستان</p>
  </div>

  <!-- فیلتر دوره زمانی -->
  <div class="glass-card p-3 mb-4">
    <div class="row g-3">
      <div class="col-md-3">
        <select class="form-select" id="reportPeriod">
          <option value="daily">روزانه</option>
          <option value="monthly" selected>ماهانه</option>
          <option value="yearly">سالانه</option>
        </select>
      </div>
      <div class="col-md-3">
        <input type="month" class="form-control" id="reportMonth" value="2025-05">
      </div>
      <div class="col-md-3">
        <button class="btn btn-primary w-100" onclick="generateReports()">تولید گزارش</button>
      </div>
    </div>
  </div>

  <div class="row g-4">
    <!-- کارت‌های آمار -->
    <div class="col-xl-3 col-md-6">
      <div class="glass-card p-4 text-center">
        <h6 class="text-muted">درآمد این ماه</h6>
        <h3 class="text-success fw-bold">۱,۲۶۰,۰۰۰ ؋</h3>
        <small class="text-success">↑ ۲۳٪ نسبت به ماه قبل</small>
      </div>
    </div>
    <div class="col-xl-3 col-md-6">
      <div class="glass-card p-4 text-center">
        <h6 class="text-muted">تعداد ویزیت</h6>
        <h3 class="fw-bold">۸۴</h3>
        <small>این ماه</small>
      </div>
    </div>
    <div class="col-xl-3 col-md-6">
      <div class="glass-card p-4 text-center">
        <h6 class="text-muted">مریض جدید</h6>
        <h3 class="fw-bold">۲۹</h3>
        <small>این ماه</small>
      </div>
    </div>
    <div class="col-xl-3 col-md-6">
      <div class="glass-card p-4 text-center">
        <h6 class="text-muted">میانگین رضایت</h6>
        <h3 class="fw-bold">۹۴٪</h3>
      </div>
    </div>
  </div>

  <div class="row g-4 mt-4">
    <!-- نمودار درآمد -->
    <div class="col-xl-8">
      <div class="glass-card p-4">
        <h5>درآمد ماهانه سال ۱۴۰۳</h5>
        <div style="height: 380px;">
          <canvas id="revenueChart"></canvas>
        </div>
      </div>
    </div>

    <!-- گزارش درمان‌ها -->
    <div class="col-xl-4">
      <div class="glass-card p-4 h-100">
        <h5 class="mb-3">پرفروش‌ترین درمان‌ها</h5>
        <div id="topTreatments"></div>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
// نمودار درآمد
new Chart(document.getElementById('revenueChart'), {
  type: 'bar',
  data: {
    labels: ['حمل', 'ثور', 'جوزا', 'سرطان', 'اسد', 'سنبله', 'میزان'],
    datasets: [{
      label: 'درآمد (هزار افغانی)',
      data: [3132,313,23,123,23,23,22],
      backgroundColor: '#1e88e5',
      borderRadius: 8
    }]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    plugins: { legend: { display: false } }
  }
});

// پرفروش‌ترین درمان‌ها
const treatments = [
  {name: "جرم‌گیری", count: 32, percent: 22},
  {name: "عصب‌کشی", count: 32, percent: 22},
  {name: "لمینت", count: 17, percent: 22},
  {name: "ایمپلنت", count: 22, percent: 22}
];

document.getElementById('topTreatments').innerHTML = treatments.map(t => `
  <div class="d-flex justify-content-between align-items-center py-2">
    <span>${t.name}</span>
    <div class="text-end">
      <small class="text-muted">${t.count} مورد</small><br>
      <span class="badge bg-primary">${t.percent}%</span>
    </div>
  </div>
`).join('');

function generateReports() {
  alert("✅ گزارشات با موفقیت بروزرسانی شد!");
}
</script>
</body>
</html>
