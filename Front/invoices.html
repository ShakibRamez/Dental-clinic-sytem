<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فاکتورها و پرداخت‌ها - کلینیک دندانپزشکی</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap');
    
    body {
      font-family: 'Vazirmatn', sans-serif;
      background: linear-gradient(135deg, #f0f4f8 0%, #e6edf7 100%);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.7);
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.1);
    }
    .header-gradient {
      background: linear-gradient(135deg, #2c3e50, #1e88e5);
      color: white;
    }
    .paid { background: #e8f5e9; }
    .unpaid { background: #ffebee; }
  </style>
</head>
<body class="p-4">

  <div class="header-gradient p-4 rounded-4 mb-4 text-center">
    <h2 class="fw-bold mb-1">💰 فاکتورها و پرداخت‌ها</h2>
    <p class="mb-0">کلینیک دندانپزشکی • افغانستان</p>
  </div>

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4>فاکتورهای اخیر</h4>
    <button class="btn btn-success btn-lg" data-bs-toggle="modal" data-bs-target="#newInvoiceModal">
      <i class="bi bi-receipt-cutoff"></i> فاکتور جدید
    </button>
  </div>

  <div class="glass-card p-4">
    <div class="table-responsive">
      <table class="table table-hover align-middle" id="invoicesTable">
        <thead>
          <tr>
            <th>شماره فاکتور</th>
            <th>مریض</th>
            <th>مبلغ کل</th>
            <th>تخفیف</th>
            <th>مبلغ نهایی</th>
            <th>وضعیت</th>
            <th>تاریخ</th>
            <th>عملیات</th>
          </tr>
        </thead>
        <tbody id="invoicesBody"></tbody>
      </table>
    </div>
  </div>

  <!-- Modal فاکتور جدید -->
  <div class="modal fade" id="newInvoiceModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content glass-card">
        <div class="modal-header header-gradient">
          <button type="button" 
            class="btn-close btn-close-white" 
            data-bs-dismiss="modal" 
            aria-label="Close">
           </button>
            <h5 class="modal-title fw-bold ms-auto">صدور فاکتور جدید</h5>
        </div>        <div class="modal-body p-4">
          <form id="invoiceForm">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label fw-bold">مریض</label>
                <select class="form-select" id="patient_id" required>
                  <option value="">انتخاب مریض...</option>
                  <option value="1">محمد رحیمی - M-24001</option>
                  <option value="2">فاطمه احمدی - M-24002</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-bold">شماره فاکتور</label>
                <input type="text" class="form-control" id="invoice_number" value="F-1403001" readonly>
              </div>

              <div class="col-md-4">
                <label class="form-label fw-bold">مبلغ کل (؋)</label>
                <input type="number" class="form-control" id="total_amount" placeholder="۰" required>
              </div>
              <div class="col-md-4">
                <label class="form-label fw-bold">تخفیف (؋)</label>
                <input type="number" class="form-control" id="discount" value="0">
              </div>
              <div class="col-md-4">
                <label class="form-label fw-bold">مبلغ نهایی (؋)</label>
                <input type="number" class="form-control bg-light" id="final_amount" readonly>
              </div>

              <div class="col-12">
                <label class="form-label fw-bold">توضیحات / خدمات انجام شده</label>
                <textarea class="form-control" id="description" rows="4" placeholder="جرم‌گیری + عصب‌کشی دندان..."></textarea>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">انصراف</button>
          <button type="button" class="btn btn-success px-5" onclick="saveInvoice()">صدور فاکتور</button>
        </div>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
// داده نمونه فاکتورها
let invoices = [
  {
    id: 1,
    number: "F-1403001",
    patient: "محمد رحیمی",
    total: 125000,
    discount: 15000,
    final: 110000,
    status: "paid",
    date: "۱۴۰۳/۰۲/۲۸"
  },
  {
    id: 2,
    number: "F-1403002",
    patient: "فاطمه احمدی",
    total: 280000,
    discount: 0,
    final: 280000,
    status: "unpaid",
    date: "۱۴۰۳/۰۲/۲۷"
  },
  {
    id: 3,
    number: "F-1403003",
    patient: "احمد خان",
    total: 85000,
    discount: 5000,
    final: 80000,
    status: "paid",
    date: "۱۴۰۳/۰۲/۲۶"
  }
];

function renderInvoices() {
  const tbody = document.getElementById('invoicesBody');
  tbody.innerHTML = invoices.map(inv => `
    <tr class="${inv.status === 'paid' ? 'paid' : 'unpaid'}">
      <td><strong>${inv.number}</strong></td>
      <td>${inv.patient}</td>
      <td>${inv.total.toLocaleString('fa-IR')} ؋</td>
      <td>${inv.discount.toLocaleString('fa-IR')} ؋</td>
      <td><strong>${inv.final.toLocaleString('fa-IR')} ؋</strong></td>
      <td>
        <span class="badge ${inv.status === 'paid' ? 'bg-success' : 'bg-danger'}">
          ${inv.status === 'paid' ? 'پرداخت شده' : 'پرداخت نشده'}
        </span>
      </td>
      <td>${inv.date}</td>
      <td>
        <button class="btn btn-sm btn-outline-primary" onclick="viewInvoice(${inv.id})">مشاهده</button>
        ${inv.status === 'unpaid' ? `<button class="btn btn-sm btn-success" onclick="payInvoice(${inv.id})">پرداخت</button>` : ''}
      </td>
    </tr>
  `).join('');
}

function saveInvoice() {
  alert("✅ فاکتور با موفقیت صادر شد!");
  bootstrap.Modal.getInstance(document.getElementById('newInvoiceModal')).hide();
  renderInvoices();
}

function viewInvoice(id) {
  alert(`مشاهده جزئیات فاکتور ${id}`);
}

function payInvoice(id) {
  if (confirm("آیا پرداخت این فاکتور انجام شود؟")) {
    alert("✅ پرداخت با موفقیت ثبت شد!");
    renderInvoices();
  }
}

// شروع صفحه
renderInvoices();
</script>
</body>
</html>
