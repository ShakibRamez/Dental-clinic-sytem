<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فاکتورها و پرداخت‌ها - کلینیک دندانپزشکی</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/style.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap');
    
    body {
      font-family: 'Vazirmatn', sans-serif;
      background: linear-gradient(135deg, #f0f4f8 0%, #e6edf7 100%);
      min-height: 100vh;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.1);
    }
    .header-gradient {
      background: linear-gradient(135deg, #2c3e50, #1e88e5);
      color: white;
    }
    .paid-row {
      background-color: #e8f5e9 !important;
    }
    .unpaid-row {
      background-color: #fff3e0 !important;
    }
    .stat-card {
      border-radius: 16px;
      padding: 20px;
      text-align: center;
    }
  </style>
</head>
<body class="p-4">

  <div class="header-gradient p-4 rounded-4 mb-4 text-center">
    <h2 class="mb-1 fw-bold">💰 فاکتورها و پرداخت‌ها</h2>
    <p class="mb-0">کلینیک دندانپزشکی • افغانستان</p>
  </div>

  <!-- آمار سریع -->
  <div class="row g-3 mb-4">
    <div class="col-md-3">
      <div class="glass-card stat-card">
        <h6 class="text-muted">کل فاکتورها</h6>
        <h3 id="totalInvoices">۰</h3>
      </div>
    </div>
    <div class="col-md-3">
      <div class="glass-card stat-card">
        <h6 class="text-muted">پرداخت شده</h6>
        <h3 class="text-success" id="paidCount">۰</h3>
      </div>
    </div>
    <div class="col-md-3">
      <div class="glass-card stat-card">
        <h6 class="text-muted">پرداخت نشده</h6>
        <h3 class="text-warning" id="unpaidCount">۰</h3>
      </div>
    </div>
    <div class="col-md-3">
      <div class="glass-card stat-card">
        <h6 class="text-muted">جمع مبلغ پرداخت‌شده</h6>
        <h3 class="text-primary" id="totalPaid">۰ ؋</h3>
      </div>
    </div>
  </div>

  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <button class="btn btn-outline-secondary me-2" onclick="filterInvoices('all')">همه</button>
      <button class="btn btn-outline-success me-2" onclick="filterInvoices('paid')">پرداخت شده</button>
      <button class="btn btn-outline-warning" onclick="filterInvoices('unpaid')">پرداخت نشده</button>
    </div>
    <button class="btn btn-success btn-lg" data-bs-toggle="modal" data-bs-target="#invoiceModal" onclick="openNewInvoice()">
      <i class="bi bi-plus-circle"></i> فاکتور جدید
    </button>
  </div>

  <!-- جدول فاکتورها -->
  <div class="glass-card p-4">
    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead>
          <tr>
            <th>شماره فاکتور</th>
            <th>مریض</th>
            <th>مبلغ کل</th>
            <th>تخفیف</th>
            <th>مبلغ نهایی</th>
            <th>وضعیت</th>
            <th>تاریخ</th>
            <th>عملیات</th>
          </tr>
        </thead>
        <tbody id="invoicesBody"></tbody>
      </table>
    </div>
  </div>

  <!-- Modal صدور فاکتور جدید -->
  <div class="modal fade" id="invoiceModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content glass-card">
        <div class="modal-header header-gradient">
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          <h5 class="modal-title fw-bold ms-auto" id="modalTitle">صدور فاکتور جدید</h5>
        </div>
        <div class="modal-body p-4">
          <form id="invoiceForm">
            <input type="hidden" id="edit_id">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label fw-bold">مریض</label>
                <select class="form-select" id="patient_id" required>
                  <option value="">انتخاب مریض...</option>
                  <option value="1">محمد رحیمی - M-24001</option>
                  <option value="2">فاطمه احمدی - M-24002</option>
                  <option value="3">احمد خان - M-24003</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-bold">شماره فاکتور</label>
                <input type="text" class="form-control" id="invoice_number" value="F-1403001" readonly>
              </div>

              <div class="col-md-4">
                <label class="form-label fw-bold">مبلغ کل (؋)</label>
                <input type="number" class="form-control" id="total_amount" oninput="calculateFinal()">
              </div>
              <div class="col-md-4">
                <label class="form-label fw-bold">تخفیف (؋)</label>
                <input type="number" class="form-control" id="discount" value="0" oninput="calculateFinal()">
              </div>
              <div class="col-md-4">
                <label class="form-label fw-bold">مبلغ نهایی (؋)</label>
                <input type="number" class="form-control bg-light" id="final_amount" readonly>
              </div>

              <div class="col-12">
                <label class="form-label fw-bold">توضیحات / خدمات</label>
                <textarea class="form-control" id="description" rows="3"></textarea>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">انصراف</button>
          <button type="button" class="btn btn-success px-5" onclick="saveInvoice()">صدور فاکتور</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal جزئیات فاکتور -->
  <div class="modal fade" id="invoiceDetailModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content glass-card">
        <div class="modal-header header-gradient">
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          <h5 class="modal-title fw-bold ms-auto">جزئیات فاکتور</h5>
        </div>
        <div class="modal-body p-4" id="invoiceDetailBody">
          <!-- محتوا با JS پر می‌شود -->
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">بستن</button>
          <button type="button" class="btn btn-primary" onclick="printInvoiceDetail()">
            <i class="bi bi-printer"></i> چاپ فاکتور
          </button>
        </div>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
// داده نمونه
let invoices = [
  {id:1, number:"F-1403001", patient:"محمد رحیمی", total:125000, discount:15000, final:110000, status:"paid", date:"۱۴۰۳/۰۲/۲۸"},
  {id:2, number:"F-1403002", patient:"فاطمه احمدی", total:280000, discount:0, final:280000, status:"unpaid", date:"۱۴۰۳/۰۲/۲۷"},
  {id:3, number:"F-1403003", patient:"احمد خان", total:85000, discount:5000, final:80000, status:"paid", date:"۱۴۰۳/۰۲/۲۶"},
  {id:4, number:"F-1403004", patient:"سارا محمدی", total:150000, discount:10000, final:140000, status:"unpaid", date:"۱۴۰۳/۰۲/۲۵"},
];

function renderInvoices(data = invoices) {
  const tbody = document.getElementById('invoicesBody');
  tbody.innerHTML = data.map(inv => `
    <tr class="${inv.status === 'paid' ? 'paid-row' : 'unpaid-row'}">
      <td><strong>${inv.number}</strong></td>
      <td>${inv.patient}</td>
      <td>${inv.total.toLocaleString('fa-IR')} ؋</td>
      <td>${inv.discount.toLocaleString('fa-IR')} ؋</td>
      <td><strong>${inv.final.toLocaleString('fa-IR')} ؋</strong></td>
      <td>
        <span class="badge ${inv.status === 'paid' ? 'bg-success' : 'bg-warning text-dark'}">
          ${inv.status === 'paid' ? '✓ پرداخت شده' : '⏳ پرداخت نشده'}
        </span>
      </td>
      <td>${inv.date}</td>
      <td>
        ${inv.status === 'unpaid' ? 
          `<button class="btn btn-sm btn-success me-1" onclick="markAsPaid(${inv.id})">پرداخت</button>` : ''}
        <button class="btn btn-sm btn-outline-primary me-1" onclick="viewInvoice(${inv.id})">مشاهده</button>
        <button class="btn btn-sm btn-outline-danger" onclick="deleteInvoice(${inv.id})">حذف</button>
      </td>
    </tr>
  `).join('');

  updateStats();
}

function updateStats() {
  document.getElementById('totalInvoices').textContent = invoices.length;
  document.getElementById('paidCount').textContent = invoices.filter(i => i.status === 'paid').length;
  document.getElementById('unpaidCount').textContent = invoices.filter(i => i.status === 'unpaid').length;
  
  const totalPaid = invoices
    .filter(i => i.status === 'paid')
    .reduce((sum, i) => sum + i.final, 0);
  document.getElementById('totalPaid').textContent = totalPaid.toLocaleString('fa-IR') + ' ؋';
}

function filterInvoices(type) {
  if (type === 'all') {
    renderInvoices(invoices);
  } else {
    renderInvoices(invoices.filter(i => i.status === type));
  }
}

function markAsPaid(id) {
  if (confirm("آیا پرداخت این فاکتور تأیید می‌شود؟")) {
    const invoice = invoices.find(i => i.id === id);
    if (invoice) {
      invoice.status = 'paid';
      renderInvoices();
      alert("✅ فاکتور با موفقیت پرداخت شد!");
    }
  }
}

function calculateFinal() {
  const total = Number(document.getElementById('total_amount').value) || 0;
  const discount = Number(document.getElementById('discount').value) || 0;
  document.getElementById('final_amount').value = total - discount;
}

function openNewInvoice() {
  document.getElementById('invoiceForm').reset();
  document.getElementById('discount').value = 0;
  document.getElementById('final_amount').value = '';
}

function saveInvoice() {
  alert("✅ فاکتور با موفقیت صادر شد!");
  bootstrap.Modal.getInstance(document.getElementById('invoiceModal')).hide();
  renderInvoices();
}

function viewInvoice(id) {
  const inv = invoices.find(i => i.id === id);
  if (!inv) return;

  document.getElementById('invoiceDetailBody').innerHTML = `
    <div class="text-center mb-4">
      <h4>🦷 کلینیک دندانپزشکی امید</h4>
      <p class="text-muted mb-1">فاکتور رسمی</p>
    </div>

    <div class="row mb-3">
      <div class="col-6">
        <strong>شماره فاکتور:</strong> ${inv.number}
      </div>
      <div class="col-6 text-start">
        <strong>تاریخ:</strong> ${inv.date}
      </div>
    </div>

    <div class="mb-3">
      <strong>مریض:</strong> ${inv.patient}
    </div>

    <table class="table table-bordered">
      <thead>
        <tr>
          <th>شرح</th>
          <th>مبلغ</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>مبلغ کل خدمات</td>
          <td>${inv.total.toLocaleString('fa-IR')} ؋</td>
        </tr>
        <tr>
          <td>تخفیف</td>
          <td>${inv.discount.toLocaleString('fa-IR')} ؋</td>
        </tr>
        <tr class="table-success">
          <td><strong>مبلغ نهایی</strong></td>
          <td><strong>${inv.final.toLocaleString('fa-IR')} ؋</strong></td>
        </tr>
      </tbody>
    </table>

    <div class="mt-3">
      <strong>وضعیت پرداخت:</strong>
      <span class="badge ${inv.status === 'paid' ? 'bg-success' : 'bg-warning text-dark'} fs-6">
        ${inv.status === 'paid' ? '✓ پرداخت شده' : '⏳ پرداخت نشده'}
      </span>
    </div>
  `;

  new bootstrap.Modal(document.getElementById('invoiceDetailModal')).show();
}

function printInvoiceDetail() {
  window.print();
}

function deleteInvoice(id) {
  if (confirm("آیا مطمئن هستید که می‌خواهید این فاکتور را حذف کنید؟")) {
    invoices = invoices.filter(i => i.id !== id);
    renderInvoices();
    alert("✅ فاکتور حذف شد!");
  }
}

// شروع
renderInvoices();
</script>
</body>
</html>
