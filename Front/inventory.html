<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>انبار - کلینیک دندانپزشکی</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/style.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap');
    
    body {
      font-family: 'Vazirmatn', sans-serif;
      background: linear-gradient(135deg, #f0f4f8 0%, #e6edf7 100%);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.7);
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.1);
    }
    .header-gradient {
      background: linear-gradient(135deg, #2c3e50, #1e88e5);
      color: white;
    }
    .low-stock {
      background: #ffebee;
      color: #d32f2f;
    }
  </style>
</head>
<body class="p-4">

  <div class="header-gradient p-4 rounded-4 mb-4 text-center">
    <h2 class="fw-bold mb-1">📦 مدیریت انبار</h2>
    <p class="mb-0">کلینیک دندانپزشکی • افغانستان</p>
  </div>

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4>موجودی مواد و تجهیزات</h4>
    <button class="btn btn-success btn-lg" data-bs-toggle="modal" data-bs-target="#newItemModal">
      <i class="bi bi-plus-circle"></i> اضافه کردن جنس جدید
    </button>
  </div>

  <!-- آمار سریع انبار -->
  <div class="row g-4 mb-4">
    <div class="col-md-3">
      <div class="glass-card p-3 text-center">
        <h6 class="text-muted">کل اقلام</h6>
        <h3 class="text-primary">۴۲</h3>
      </div>
    </div>
    <div class="col-md-3">
      <div class="glass-card p-3 text-center low-stock">
        <h6>موجودی کم</h6>
        <h3 class="text-danger">۷</h3>
      </div>
    </div>
    <div class="col-md-3">
      <div class="glass-card p-3 text-center">
        <h6>ارزش کل انبار</h6>
        <h3 class="text-success">۱,۲۶۰,۰۰۰ ؋</h3>
      </div>
    </div>
    <div class="col-md-3">
      <div class="glass-card p-3 text-center">
        <h6>موارد رو به اتمام</h6>
        <h3 class="text-warning">۵</h3>
      </div>
    </div>
  </div>

  <div class="glass-card p-4">
    <div class="table-responsive">
      <table class="table table-hover align-middle" id="inventoryTable">
        <thead>
          <tr>
            <th>کد جنس</th>
            <th>نام جنس</th>
            <th>دسته‌بندی</th>
            <th>موجودی</th>
            <th>حداقل موجودی</th>
            <th>قیمت خرید (؋)</th>
            <th>وضعیت</th>
            <th>عملیات</th>
          </tr>
        </thead>
        <tbody id="inventoryBody"></tbody>
      </table>
    </div>
  </div>

  <!-- Modal اضافه کردن جنس جدید -->
  <div class="modal fade" id="newItemModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content glass-card">
         <div class="modal-header header-gradient">
          <button type="button" 
            class="btn-close btn-close-white" 
            data-bs-dismiss="modal" 
            aria-label="Close">
           </button>
            <h5 class="modal-title fw-bold ms-auto">ثبت جنس جدید</h5>
        </div>
        <div class="modal-body p-4">
          <form id="inventoryForm">
            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label fw-bold">کد جنس</label>
                <input type="text" class="form-control" id="item_code" placeholder="MAT-001" required>
              </div>
              <div class="col-md-8">
                <label class="form-label fw-bold">نام جنس</label>
                <input type="text" class="form-control" id="item_name" placeholder="کامپوزیت A2" required>
              </div>

              <div class="col-md-4">
                <label class="form-label fw-bold">دسته‌بندی</label>
                <select class="form-select" id="category">
                  <option value="مواد ترمیمی">مواد ترمیمی</option>
                  <option value="ابزار">ابزار</option>
                  <option value="مصرفی">مصرفی</option>
                  <option value="دارویی">دارویی</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label fw-bold">موجودی فعلی</label>
                <input type="number" class="form-control" id="current_stock" required>
              </div>
              <div class="col-md-4">
                <label class="form-label fw-bold">حداقل موجودی</label>
                <input type="number" class="form-control" id="min_stock" value="10">
              </div>

              <div class="col-md-6">
                <label class="form-label fw-bold">قیمت خرید (؋)</label>
                <input type="number" class="form-control" id="purchase_price">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-bold">محل نگهداری</label>
                <input type="text" class="form-control" id="location" placeholder="قفسه A-3">
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">انصراف</button>
          <button type="button" class="btn btn-success px-5" onclick="saveItem()">ثبت در انبار</button>
        </div>
      </div>
    </div>
  </div>

<script src="assets/js/auth.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
// داده نمونه انبار
let inventory = [
  {id:1, code:"MAT-001", name:"کامپوزیت A2", category:"مواد ترمیمی", stock:12, minStock:15, price:4500, location:"قفسه A-1"},
  {id:2, code:"MAT-002", name:"لیدوکائین", category:"دارویی", stock:45, minStock:20, price:1200, location:"یخچال"},
  {id:3, code:"INS-005", name:"توربین دندانپزشکی", category:"ابزار", stock:3, minStock:5, price:18500, location:"قفسه B-2"},
  {id:4, code:"MAT-003", name:"ساکشن", category:"مصرفی", stock:68, minStock:30, price:800, location:"قفسه C"},
];

function renderInventory() {
  const tbody = document.getElementById('inventoryBody');
  tbody.innerHTML = inventory.map(item => `
    <tr class="${item.stock < item.minStock ? 'low-stock' : ''}">
      <td><strong>${item.code}</strong></td>
      <td>${item.name}</td>
      <td>${item.category}</td>
      <td><strong>${item.stock}</strong></td>
      <td>${item.minStock}</td>
      <td>${item.price.toLocaleString('fa-IR')} ؋</td>
      <td>
        ${item.stock < item.minStock 
          ? '<span class="badge bg-danger">کم</span>' 
          : '<span class="badge bg-success">کافی</span>'}
      </td>
      <td>
        <button class="btn btn-sm btn-outline-primary" onclick="editItem(${item.id})">ویرایش</button>
      </td>
    </tr>
  `).join('');
}

function saveItem() {
  alert("✅ جنس جدید با موفقیت به انبار اضافه شد!");
  bootstrap.Modal.getInstance(document.getElementById('newItemModal')).hide();
  renderInventory();
}

function editItem(id) {
  alert(`ویرایش جنس شماره ${id}`);
}

// شروع صفحه
renderInventory();
</script>
</body>
</html>
