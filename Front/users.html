<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>کاربران - کلینیک دندانپزشکی</title>
  <script>document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('theme') || 'light')</script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/style.css">
  
</head>
<body class="p-4">

  <div class="text-center mb-4">
    <h2 class="fw-bold">👤 مدیریت کاربران سیستم</h2>
    <small class="text-muted">نسخه ۱.۰ - افغانستان</small>
  </div>

  <div class="glass-card p-4">
    <button class="btn btn-success mb-3" data-bs-toggle="modal" data-bs-target="#newUserModal">+ کاربر جدید</button>
    
    <table class="table table-hover" id="usersTable">
      <thead>
        <tr>
          <th>آیدی</th>
          <th>نام کامل</th>
          <th>نام کاربری</th>
          <th>شماره تلفن</th>
          <th>نقش</th>
          <th>وضعیت</th>
          <th>عملیات</th>
        </tr>
      </thead>
      <tbody id="usersBody"></tbody>
    </table>
  </div>

  <!-- Modal کاربر جدید -->
  <div class="modal fade" id="newUserModal">
    <div class="modal-dialog">
      <div class="modal-content glass-card">
         <div class="modal-header header-gradient">
          <h5 class="modal-title fw-bold">ثبت کاربر جدید</h5>
          <button type="button" 
            class="btn-close btn-close-white" 
            data-bs-dismiss="modal" 
            aria-label="Close">
           </button>
        </div>
        <div class="modal-body">
          <form method="post" id="userForm">
            <div class="mb-3">
              <label>نام کامل</label>
              <input type="text" class="form-control" id="full_name" required>
            </div>
            <div class="mb-3">
              <label>نام کاربری</label>
              <input type="text" class="form-control" id="username" required>
            </div>
            <div class="mb-3">
              <label>رمز عبور</label>
              <input type="password" class="form-control" id="password" required>
            </div>
            <div class="mb-3">
              <label>شماره تلفن</label>
              <input type="text" class="form-control" id="phone" required>
            </div>
            <div class="mb-3">
              <label>نقش کاربر</label>
              <select class="form-select" id="role">
                <option value="admin">مدیر سیستم</option>
                <option value="doctor">داکتر</option>
                <option value="receptionist">مسئول پذیرش</option>
                <option value="accountant">حسابدار</option>
              </select>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">انصراف</button>
          <button type="button" class="btn btn-success" onclick="saveUser()">ثبت کاربر</button>
        </div>
      </div>
    </div>
  </div>
<script src="assets/js/app.js"></script>
<script src="assets/js/auth.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>


//  DELETING USER
const userBody = document.getElementById('usersBody').addEventListener("click", (e)=> {
  if(e.target.className.indexOf('btn') != -1){
    if(!confirm("آیا مطمئن هستید؟")){
      return;
    }
    let id = e.target.parentElement.parentElement.firstElementChild.textContent;
    deleteUser(id);
  }
  renderUsers();
  e.preventDefault();
})

async function loadUsers() {
  const res = await fetch('/api/users', { credentials: 'same-origin' });
  const txt = await res.text(); let data;
  try { data = JSON.parse(txt); } catch { throw new Error('پاسخ سرور JSON نیست'); }
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return Array.isArray(data) ? data : (data.users || []);
}
async function renderUsers() {
  const body = document.getElementById('usersBody'); let users;
  try { users = await loadUsers(); }
  catch (e) { body.innerHTML = '<tr><td colspan="7" class="text-center text-danger py-4">دریافت فهرست کاربران ممکن نشد. اتصال سرور را بررسی کنید.</td></tr>'; return; }
  if (!users.length) { body.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4">هنوز کاربری ثبت نشده است</td></tr>'; return; }
  body.innerHTML = users.map(u => `<tr><td>${esc(u.id)}</td><td>${esc(u.full_name)}</td><td class="savedUsername">${esc(u.username)}</td><td dir="ltr">${esc(u.phone)}</td>
    <td><span class="badge bg-primary">${esc(u.role)}</span></td><td><span class="badge ${u.is_active ? 'bg-success' : 'bg-secondary'}">${u.is_active ? 'فعال' : 'غیرفعال'}</span></td>
    <td><button class="btn btn-sm btn-outline-danger" onclick="deleteUser(${Number(u.id)})"><i class="bi bi-trash"></i> حذف</button></td></tr>`).join('');
}
async function deleteUser(id) {
  if (!confirm('این کاربر حذف شود؟')) return;
  try { const r = await fetch('/api/users/' + id, { method: 'DELETE', credentials: 'same-origin' }); if (!r.ok) throw 0; alert('✅ کاربر حذف شد'); } catch { alert('❌ حذف انجام نشد'); }
  renderUsers();
}
async function saveUser() {
  const val = id => document.getElementById(id).value.trim();
  const user = { full_name: val('full_name'), username: val('username'), password_hash: document.getElementById('password').value, phone: val('phone'), role: val('role') };
  if (!user.full_name || !user.username || !user.password_hash) return alert('⚠️ نام، نام کاربری و رمز عبور الزامی است');
  if ([...document.querySelectorAll('.savedUsername')].some(c => c.textContent === user.username)) return alert('⚠️ این نام کاربری قبلاً ثبت شده است');
  try { const r = await fetch('/api/users', { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin', body: JSON.stringify(user) }); if (!r.ok) throw 0; }
  catch { return alert('❌ ثبت کاربر انجام نشد'); }
  alert('✅ کاربر جدید با موفقیت ثبت شد!');
  bootstrap.Modal.getInstance(document.getElementById('newUserModal')).hide();
  renderUsers();
}

renderUsers();
</script>
</body>
</html>
