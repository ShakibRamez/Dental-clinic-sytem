<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود به سیستم</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #2c3e50, #1e88e5);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Vazirmatn', sans-serif;
    }
    .login-card {
      background: rgba(255,255,255,0.95);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="text-center mb-4">
      <h1 class="mb-2">🦷</h1>
      <h3>کلینیک دندانپزشکی</h3>
      <p class="text-muted">سیستم مدیریت</p>
    </div>

    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label fw-bold">نام کاربری</label>
        <input type="text" class="form-control form-control-lg" id="username" placeholder="admin" required>
      </div>
      <div class="mb-4">
        <label class="form-label fw-bold">رمز عبور</label>
        <input type="password" class="form-control form-control-lg" id="password" placeholder="1234" required>
      </div>

      <button type="submit" class="btn btn-primary btn-lg w-100">ورود به سیستم</button>
    </form>
  </div>

<script>
// لاگین با رمز خاص
document.getElementById('loginForm').addEventListener('submit', function(e) {
  e.preventDefault();

  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();

  if (username === "admin" && password === "1234") {
    // ذخیره وضعیت لاگین
    localStorage.setItem("isLoggedIn", "true");
    localStorage.setItem("username", username);
    
    alert("✅ ورود موفق! خوش آمدید");
    window.location.href = "index.html";
  } else {
    alert("❌ نام کاربری یا رمز عبور اشتباه است!\n\nadmin / 1234");
  }
});
</script>
</body>
</html>
