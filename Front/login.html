<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود به سیستم - کلینیک دندانپزشکی</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/style.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap');
    
    body {
      font-family: 'Vazirmatn', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .login-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 420px;
      padding: 50px 40px;
    }
    .logo {
      font-size: 4.5rem;
      margin-bottom: 10px;
    }
    .form-control {
      border-radius: 12px;
      padding: 14px 16px;
      border: 2px solid #e2e8f0;
    }
    .form-control:focus {
      border-color: #1e40af;
      box-shadow: 0 0 0 4px rgba(30, 64, 175, 0.15);
    }
    .btn-login {
      border-radius: 12px;
      padding: 14px;
      font-weight: 600;
      font-size: 1.1rem;
      background: linear-gradient(135deg, #1e40af, #3b82f6);
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="text-center mb-5">
      <div class="logo">🦷</div>
      <h2 class="fw-bold text-dark">کلینیک دندانپزشکی</h2>
      <p class="text-muted">سیستم مدیریت حرفه‌ای</p>
    </div>

    <form id="loginForm">
      <div class="mb-4">
        <label class="form-label fw-bold">نام کاربری</label>
        <input type="text" class="form-control form-control-lg" id="username" placeholder="admin" required>
      </div>
      <div class="mb-4">
        <label class="form-label fw-bold">رمز عبور</label>
        <input type="password" class="form-control form-control-lg" id="password" placeholder="1234" required>
      </div>

      <button type="submit" class="btn btn-primary btn-login w-100">
        ورود به سیستم
      </button>
    </form>

    <div class="text-center mt-4">
      <small class="text-muted">برای تست: <strong>admin / 1234</strong></small>
    </div>
  </div>

<script src="./assets/js/auth.js"></script>
<script>
console.log('inside login');
document.getElementById('loginForm').addEventListener('submit', function(e) {
  e.preventDefault();
  
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();
  
  if (login(username, password)) {
    window.location.href = "/loading";
  } else {
    alert("❌ نام کاربری یا رمز عبور اشتباه است!\n\nadmin / 1234");
  }
});
</script>

</body>
</html>
