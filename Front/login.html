<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود به سیستم - کلینیک دندانپزشکی</title>
  <script>document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('theme') || 'light')</script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/style.css">
  <style>
    body { display: grid; place-items: center; padding: 16px; }
    .login-card { width: 100%; max-width: 400px; padding: 40px 34px; background: var(--card); border: 1px solid var(--line);
      border-radius: 20px; box-shadow: 0 20px 50px rgba(15,23,42,.08); }
    .logo { width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 16px; display: grid; place-items: center;
      font-size: 1.6rem; background: var(--accent-soft); color: var(--accent-strong); }
    .form-control { padding: .75rem 1rem; }
    .btn-login { padding: .75rem; font-weight: 600; }
    .pw-toggle { position: absolute; inset-block: 0; inset-inline-start: 4px; border: 0; background: none; color: var(--muted); padding: 0 12px; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="text-center mb-4">
      <div class="logo"><i class="bi bi-heart-pulse-fill"></i></div>
      <h4 class="fw-bold mb-1">کلینیک دندانپزشکی</h4>
      <p class="text-secondary mb-0">برای ادامه وارد حساب خود شوید</p>
    </div>

    <div id="err" class="alert alert-danger py-2 small d-none" role="alert"></div>

    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label for="username" class="form-label fw-bold">نام کاربری</label>
        <input type="text" class="form-control" id="username" autocomplete="username" required autofocus>
      </div>
      <div class="mb-4">
        <label for="password" class="form-label fw-bold">رمز عبور</label>
        <div class="position-relative">
          <input type="password" class="form-control" id="password" autocomplete="current-password" required>
          <button type="button" class="pw-toggle" id="pwToggle" aria-label="نمایش رمز"><i class="bi bi-eye"></i></button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-login w-100" id="submitBtn">
        <span class="spinner-border spinner-border-sm d-none me-2" id="spin"></span>ورود به سیستم
      </button>
    </form>
  </div>

<script src="./assets/js/app.js"></script>
<script src="./assets/js/auth.js"></script>
<script>
  const $ = id => document.getElementById(id);
  if (sessionStorage.getItem('isLoggedIn') === 'true') location.replace('index.html');

  $('pwToggle').onclick = () => {
    const show = $('password').type === 'password';
    $('password').type = show ? 'text' : 'password';
    $('pwToggle').firstElementChild.className = 'bi bi-eye' + (show ? '-slash' : '');
  };

  $('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const username = $('username').value.trim(), password = $('password').value;
    $('err').classList.add('d-none');
    if (!username || !password) return showErr('نام کاربری و رمز عبور را وارد کنید');

    $('submitBtn').disabled = true; $('spin').classList.remove('d-none');
    const r = await login(username, password);
    if (r.ok) return (window.location.href = '/loading');
    showErr(r.message);
    $('submitBtn').disabled = false; $('spin').classList.add('d-none');
    $('password').select();
  });
  function showErr(m) { $('err').textContent = m; $('err').classList.remove('d-none'); }
</script>
</body>
</html>
