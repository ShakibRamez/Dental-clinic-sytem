<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نوبت‌دهی - کلینیک دندانپزشکی</title>
  <script>document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('theme') || 'light')</script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/style.css">
  
</head>
<body class="p-4">

  <div class="header-gradient p-4 rounded-4 mb-4 text-center">
    <h2 class="mb-1 fw-bold">📅 سیستم نوبت‌دهی</h2>
    <p class="mb-0">کلینیک دندانپزشکی • افغانستان</p>
  </div>

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4>نوبت‌های امروز و آینده</h4>
    <button class="btn btn-success btn-lg" data-bs-toggle="modal" data-bs-target="#appointmentModal" onclick="openNewAppointment()">
      <i class="bi bi-plus-circle"></i> ثبت نوبت جدید
    </button>
  </div>

  <!-- جدول نوبت‌ها -->
  <div class="glass-card p-4">
    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead>
          <tr>
            <th>ساعت</th>
            <th>تاریخ</th>
            <th>مریض</th>
            <th>شماره تماس</th>
            <th>داکتر</th>
            <th>نوع نوبت</th>
            <th>وضعیت</th>
            <th>عملیات</th>
          </tr>
        </thead>
        <tbody id="appointmentsBody"></tbody>
      </table>
    </div>
  </div>

  <!-- Modal ثبت / ویرایش نوبت -->
  <div class="modal fade" id="appointmentModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content glass-card">
        <div class="modal-header header-gradient">
          <h5 class="modal-title fw-bold" id="modalTitle">ثبت نوبت جدید</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4">
          <form id="appointmentForm">
            <input type="hidden" id="edit_id">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label fw-bold">مریض</label>
                <select class="form-select" id="patient_id" required>
                  <option value="">انتخاب مریض...</option>
                  <option value="1">محمد رحیمی - M-24001</option>
                  <option value="2">فاطمه احمدی - M-24002</option>
                  <option value="3">احمد خان - M-24003</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-bold">داکتر</label>
                <select class="form-select" id="doctor_id" required>
                  <option value="1">داکتر احمد رحمانی</option>
                  <option value="2">داکتر فاطمه کریمی</option>
                  <option value="3">داکتر محمد نوری</option>
                </select>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-bold">تاریخ نوبت</label>
                <input type="date" class="form-control" id="appointment_date" required>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-bold">ساعت</label>
                <input type="time" class="form-control" id="appointment_time" required>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-bold">نوع نوبت</label>
                <select class="form-select" id="appointment_type">
                  <option value="معاینه">معاینه</option>
                  <option value="جرم‌گیری">جرم‌گیری</option>
                  <option value="عصب‌کشی">عصب‌کشی</option>
                  <option value="پر کردن">پر کردن</option>
                  <option value="لمینت">لمینت</option>
                  <option value="ایمپلنت">ایمپلنت</option>
                </select>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-bold">وضعیت</label>
                <select class="form-select" id="status">
                  <option value="pending">در انتظار</option>
                  <option value="confirmed">تأیید شده</option>
                  <option value="completed">انجام شده</option>
                  <option value="cancelled">لغو شده</option>
                </select>
              </div>

              <div class="col-12">
                <label class="form-label fw-bold">توضیحات</label>
                <textarea class="form-control" id="notes" rows="3"></textarea>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">انصراف</button>
          <button type="button" class="btn btn-success px-5" onclick="saveAppointment()">ذخیره نوبت</button>
        </div>
      </div>
    </div>
  </div>

<script src="assets/js/app.js"></script>
<script src="assets/js/auth.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
// داده نمونه
let appointments = [
  {id:1, time:"09:00", date:"۱۴۰۳/۰۲/۲۸", patient:"محمد رحیمی", phone:"0785123456", doctor:"داکتر احمد رحمانی", type:"معاینه", status:"confirmed"},
  {id:2, time:"10:30", date:"۱۴۰۳/۰۲/۲۸", patient:"فاطمه احمدی", phone:"0791234567", doctor:"داکتر فاطمه کریمی", type:"جرم‌گیری", status:"pending"},
  {id:3, time:"13:00", date:"۱۴۰۳/۰۲/۲۸", patient:"احمد خان", phone:"0779988776", doctor:"داکتر احمد رحمانی", type:"عصب‌کشی", status:"confirmed"},
];

let editMode = false;

function renderAppointments() {
  const tbody = document.getElementById('appointmentsBody');
  tbody.innerHTML = appointments.map(a => `
    <tr>
      <td><strong>${a.time}</strong></td>
      <td>${a.date}</td>
      <td>${a.patient}</td>
      <td dir="ltr">${a.phone}</td>
      <td>${a.doctor}</td>
      <td>${a.type}</td>
      <td>
        <span class="badge ${a.status === 'confirmed' ? 'bg-success' : a.status === 'pending' ? 'bg-warning' : 'bg-secondary'}">
          ${a.status === 'confirmed' ? 'تأیید شده' : a.status === 'pending' ? 'در انتظار' : a.status}
        </span>
      </td>
      <td>
        <button class="btn btn-sm btn-outline-primary me-1" onclick="editAppointment(${a.id})">ویرایش</button>
        <button class="btn btn-sm btn-outline-danger" onclick="deleteAppointment(${a.id})">حذف</button>
      </td>
    </tr>
  `).join('');
}

function openNewAppointment() {
  editMode = false;
  document.getElementById('modalTitle').textContent = 'ثبت نوبت جدید';
  document.getElementById('appointmentForm').reset();
  document.getElementById('edit_id').value = '';
}

function editAppointment(id) {
  const appt = appointments.find(a => a.id === id);
  if (!appt) return;

  editMode = true;
  document.getElementById('modalTitle').textContent = 'ویرایش نوبت';
  document.getElementById('edit_id').value = appt.id;
  
  // پر کردن فرم (در نسخه واقعی از داده کامل استفاده می‌شود)
  new bootstrap.Modal(document.getElementById('appointmentModal')).show();
}

function saveAppointment() {
  alert(editMode ? "✅ نوبت با موفقیت ویرایش شد!" : "✅ نوبت جدید با موفقیت ثبت شد!");
  bootstrap.Modal.getInstance(document.getElementById('appointmentModal')).hide();
  renderAppointments();
}

function deleteAppointment(id) {
  if (confirm("آیا مطمئن هستید که می‌خواهید این نوبت را حذف کنید؟")) {
    appointments = appointments.filter(a => a.id !== id);
    renderAppointments();
    alert("✅ نوبت با موفقیت حذف شد!");
  }
}

// شروع
renderAppointments();
</script>
</body>
</html>
