<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تاریخچه مریض - کلینیک دندانپزشکی</title>
  <script>document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('theme') || 'light')</script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/style.css">
  
</head>
<body class="p-4">

  <div class="glass-card p-4">
    <div class="d-flex justify-content-between mb-4">
      <h3>تاریخچه کامل مریض</h3>
      <button class="btn btn-primary" onclick="window.history.back()">بازگشت</button>
    </div>

    <div class="row">
      <div class="col-md-4">
        <div class="glass-card p-4 text-center mb-4">
          <h5>محمد رحیمی</h5>
          <p class="text-muted">M-24001 • ۰۷۸۵۱۲۳۴۵۶</p>
          <hr>
          <p><strong>سن:</strong> ۳۸ سال</p>
          <p><strong>آخرین ویزیت:</strong> ۱۴۰۳/۰۲/۲۸</p>
        </div>
      </div>

      <div class="col-md-8">
        <h5 class="mb-3">تاریخچه ویزیت‌ها و درمان‌ها</h5>
        <div class="timeline">
          <div class="border-start ps-3 mb-4">
            <strong>۱۴۰۳/۰۲/۲۸</strong> - عصب‌کشی دندان ۴۶
            <p class="text-muted small">داکتر احمد رحمانی • تشخیص: پوسیدگی عمیق</p>
          </div>
          <div class="border-start ps-3 mb-4">
            <strong>۱۴۰۳/۰۱/۱۵</strong> - جرم‌گیری و تمیزکاری
            <p class="text-muted small">داکتر فاطمه کریمی</p>
          </div>
          <div class="border-start ps-3 mb-4">
            <strong>۱۴۰۲/۱۰/۲۰</strong> - معاینه دوره‌ای
            <p class="text-muted small">داکتر احمد رحمانی</p>
          </div>
        </div>
      </div>
    </div>
  </div>
<script src="assets/js/app.js"></script>
<script src="assets/js/auth.js"></script>
</body>
</html>
