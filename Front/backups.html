<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بک‌آپ‌گیری - کلینیک دندانپزشکی</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/style.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap');
    
    body {
      font-family: 'Vazirmatn', sans-serif;
      background: linear-gradient(135deg, #f0f4f8 0%, #e6edf7 100%);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.7);
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.1);
    }
    .header-gradient {
      background: linear-gradient(135deg, #2c3e50, #1e88e5);
      color: white;
    }
    .success { color: #28a745; }
  </style>
</head>
<body class="p-4">

  <div class="header-gradient p-4 rounded-4 mb-4 text-center">
    <h2 class="fw-bold mb-1">☁️ بک‌آپ‌گیری سیستم</h2>
    <p class="mb-0">کلینیک دندانپزشکی • افغانستان</p>
  </div>

  <div class="row g-4">
    <!-- وضعیت بک‌آپ -->
    <div class="col-lg-4">
      <div class="glass-card p-4 h-100">
        <h5 class="mb-4">وضعیت بک‌آپ خودکار</h5>
        <div class="text-center py-4">
          <i class="bi bi-cloud-check-fill fs-1 success"></i>
          <h4 class="mt-3 text-success">فعال</h4>
          <p class="text-muted">بک‌آپ هر شب ساعت ۲۳:۴۵ به صورت خودکار گرفته می‌شود</p>
        </div>
        <div class="alert alert-info">
          آخرین بک‌آپ: <strong>امروز - ۱۴۰۳/۰۲/۲۸ ساعت ۲۳:۴۵</strong><br>
          حجم: ۲۳.۴ مگابایت
        </div>
        <button class="btn btn-success w-100 py-3" onclick="manualBackup()">
          <i class="bi bi-cloud-arrow-up"></i> ایجاد بک‌آپ دستی فوری
        </button>
      </div>
    </div>

    <!-- لیست بک‌آپ‌ها -->
    <div class="col-lg-8">
      <div class="glass-card p-4">
        <h5 class="mb-3">تاریخچه بک‌آپ‌ها</h5>
        <div class="table-responsive">
          <table class="table table-hover" id="backupsTable">
            <thead>
              <tr>
                <th>تاریخ</th>
                <th>ساعت</th>
                <th>نوع بک‌آپ</th>
                <th>حجم فایل</th>
                <th>وضعیت</th>
                <th>نام فایل</th>
                <th>عملیات</th>
              </tr>
            </thead>
            <tbody id="backupsBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal تنظیمات بک‌آپ -->
  <div class="modal fade" id="backupSettingsModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content glass-card">
        <div class="modal-header header-gradient">
          <h5 class="modal-title">تنظیمات بک‌آپ خودکار</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4">
          <div class="mb-3">
            <label class="form-label">زمان اجرای روزانه</label>
            <input type="time" class="form-control" value="23:45">
          </div>
          <div class="mb-3">
            <label class="form-label">حذف بک‌آپ‌های قدیمی‌تر از</label>
            <select class="form-select">
              <option value="30">۳۰ روز</option>
              <option value="60" selected>۶۰ روز</option>
              <option value="90">۹۰ روز</option>
            </select>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" checked>
            <label class="form-check-label">فشرده‌سازی فایل بک‌آپ (ZIP)</label>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">بستن</button>
          <button type="button" class="btn btn-primary" onclick="saveSettings()">ذخیره تنظیمات</button>
        </div>
      </div>
    </div>
  </div>
<script src="assets/js/auth.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
// داده نمونه بک‌آپ
let backups = [
  {id:1, date:"۱۴۰۳/۰۲/۲۸", time:"۲۳:۴۵", type:"خودکار", size:"۲۳.۴ MB", status:"موفق", filename:"backup_20250520.sql"},
  {id:2, date:"۱۴۰۳/۰۲/۲۷", time:"۲۳:۴۵", type:"خودکار", size:"۲۲.۸ MB", status:"موفق", filename:"backup_20250519.sql"},
  {id:3, date:"۱۴۰۳/۰۲/۲۶", time:"۲۳:۳۰", type:"دستی", size:"۲۴.۱ MB", status:"موفق", filename:"manual_backup_01.sql"},
  {id:4, date:"۱۴۰۳/۰۲/۲۵", time:"۲۳:۴۵", type:"خودکار", size:"۲۱.۹ MB", status:"موفق", filename:"backup_20250518.sql"},
];

function renderBackups() {
  const tbody = document.getElementById('backupsBody');
  tbody.innerHTML = backups.map(b => `
    <tr>
      <td>${b.date}</td>
      <td>${b.time}</td>
      <td>${b.type}</td>
      <td>${b.size}</td>
      <td><span class="badge bg-success">${b.status}</span></td>
      <td><small>${b.filename}</small></td>
      <td>
        <button class="btn btn-sm btn-outline-success">دانلود</button>
      </td>
    </tr>
  `).join('');
}

function manualBackup() {
  if (confirm("آیا می‌خواهید بک‌آپ دستی ایجاد شود؟")) {
    alert("✅ بک‌آپ دستی شروع شد...\n\nلطفاً چند لحظه صبر کنید.");
    setTimeout(() => {
      alert("✅ بک‌آپ با موفقیت ایجاد و ذخیره شد!");
      renderBackups();
    }, 1500);
  }
}

function saveSettings() {
  alert("✅ تنظیمات بک‌آپ با موفقیت ذخیره شد!");
  bootstrap.Modal.getInstance(document.getElementById('backupSettingsModal')).hide();
}

// شروع صفحه
renderBackups();
</script>
</body>
</html>
