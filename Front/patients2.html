<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مریضان - کلینیک دندانپزشکی</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap');
    
    body {
      font-family: 'Vazirmatn', sans-serif;
      background: linear-gradient(135deg, #f0f4f8 0%, #e6edf7 100%);
      min-height: 100vh;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.7);
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.1);
    }
    .header-gradient {
      background: linear-gradient(135deg, #2c3e50, #1e88e5);
      color: white;
    }
    .table th {
      background: #2c3e50;
      color: white;
      font-weight: 500;
    }
    .patient-row:hover {
      background: #f0f7ff !important;
      transform: scale(1.02);
      transition: all 0.3s ease;
    }
    .afghani { font-weight: bold; color: #28a745; }
  </style>
</head>
<body class="p-4">

  <div class="header-gradient p-4 rounded-4 mb-4 text-center">
    <h2 class="mb-1 fw-bold">👥 مدیریت مریضان</h2>
    <p class="mb-0">کلینیک دندانپزشکی • افغانستان</p>
  </div>

  <div class="glass-card p-4 mb-4">
    <div class="row g-3 align-items-center">
      <div class="col-md-5">
        <input type="text" id="searchInput" class="form-control form-control-lg" 
               placeholder="جستجو نام، تخلص، شماره تماس یا کد مریض..." onkeyup="filterPatients()">
      </div>
      <div class="col-md-3">
        <select class="form-select form-select-lg" id="genderFilter" onchange="filterPatients()">
          <option value="">همه جنسیت‌ها</option>
          <option value="male">مذکر</option>
          <option value="female">مونث</option>
        </select>
      </div>
      <div class="col-md-4">
        <button class="btn btn-success btn-lg w-100" data-bs-toggle="modal" data-bs-target="#patientModal">
          <i class="bi bi-plus-circle"></i> ثبت مریض جدید
        </button>
      </div>
    </div>
  </div>

  <!-- جدول مریضان -->
  <div class="glass-card p-4">
    <div class="table-responsive">
      <table class="table table-hover align-middle" id="patientsTable">
        <thead>
          <tr>
            <th>کد مریض</th>
            <th>نام و تخلص</th>
            <th>شماره تماس</th>
            <th>جنسیت</th>
            <th>تاریخ تولد</th>
            <th>آخرین ویزیت</th>
            <th>عملیات</th>
          </tr>
        </thead>
        <tbody id="patientsBody"></tbody>
      </table>
    </div>
  </div>

  <!-- Modal ثبت مریض جدید - مدرن -->
  <div class="modal fade" id="patientModal" tabindex="-1">
    <div class="modal-dialog modal-xl">
      <div class="modal-content glass-card">
        <div class="modal-header header-gradient">
           <button type="button" 
            class="btn-close btn-close-white" 
            data-bs-dismiss="modal" 
            aria-label="Close">
           </button>
             <h5 class="modal-title fw-bold ms-auto">ثبت مریض جدید</h5>
        </div>
        <div class="modal-body p-4">
          <form id="patientForm">
            <div class="row g-4">
              <div class="col-md-3">
                <label class="form-label fw-bold">کد مریض</label>
                <input type="text" class="form-control" id="patient_code" placeholder="M-24001">
              </div>
              <div class="col-md-4">
                <label class="form-label fw-bold">نام</label>
                <input type="text" class="form-control" id="first_name" required>
              </div>
              <div class="col-md-5">
                <label class="form-label fw-bold">تخلص</label>
                <input type="text" class="form-control" id="last_name" required>
              </div>

              <div class="col-md-4">
                <label class="form-label fw-bold">شماره تماس</label>
                <input type="tel" class="form-control" id="phone" placeholder="07xxxxxxxx" required>
              </div>
              <div class="col-md-4">
                <label class="form-label fw-bold">تذکره / کد ملی</label>
                <input type="text" class="form-control" id="national_id">
              </div>
              <div class="col-md-4">
                <label class="form-label fw-bold">تاریخ تولد</label>
                <input type="date" class="form-control" id="date_of_birth">
              </div>

              <div class="col-md-4">
                <label class="form-label fw-bold">جنسیت</label>
                <select class="form-select" id="gender">
                  <option value="male">مذکر</option>
                  <option value="female">مونث</option>
                </select>
              </div>

              <div class="col-12">
                <label class="form-label fw-bold">آدرس</label>
                <input type="text" class="form-control" id="address" placeholder="ولایت، ناحیه، سرک...">
              </div>

              <div class="col-12">
                <label class="form-label fw-bold">آلرژی و سابقه طبی</label>
                <textarea class="form-control" id="medical_notes" rows="3" placeholder="مثلاً: حساسیت به پنی‌سیلین، فشار خون..."></textarea>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">انصراف</button>
          <button type="button" class="btn btn-success px-5" onclick="savePatient()">ثبت مریض</button>
        </div>
      </div>
    </div>
  </div>

<script src="assets/js/auth.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
// داده نمونه افغانستان
let patients = [
  {id:1, code:"M-24001", first_name:"محمد", last_name:"رحیمی", phone:"0785123456", gender:"male", dob:"1365-04-12", last_visit:"۱۴۰۳/۰۲/۲۰"},
  {id:2, code:"M-24002", first_name:"فاطمه", last_name:"احمدی", phone:"0791234567", gender:"female", dob:"1370-11-12", last_visit:"۱۴۰۳/۰۲/۲۵"},
  {id:3, code:"M-24003", first_name:"احمد", last_name:"خان", phone:"0779988776", gender:"male", dob:"1368-2-2", last_visit:"۱۴۰۳/۰۲/۱۸"},
];

function renderPatients(data) {
  const tbody = document.getElementById('patientsBody');
  tbody.innerHTML = data.map(p => `
    <tr class="patient-row">
      <td><strong>${p.code}</strong></td>
      <td>${p.first_name} ${p.last_name}</td>
      <td dir="ltr">${p.phone}</td>
      <td>${p.gender === 'male' ? '👨 مذکر' : '👩 مونث'}</td>
      <td>${p.dob}</td>
      <td>${p.last_visit}</td>
      <td>
        <button class="btn btn-sm btn-outline-primary me-1" onclick="editPatient(${p.id})">ویرایش</button>
        <button class="btn btn-sm btn-outline-info" onclick="viewHistory(${p.id})" link>سابقه</button>
      </td>
    </tr>
  `).join('');
}

// جستجو و فیلتر
function filterPatients() {
  const search = document.getElementById('searchInput').value.toLowerCase().trim();
  const gender = document.getElementById('genderFilter').value;

  const filtered = patients.filter(p => {
    const fullName = (p.first_name + " " + p.last_name).toLowerCase();
    return (fullName.includes(search) || p.phone.includes(search) || p.code.toLowerCase().includes(search)) &&
           (!gender || p.gender === gender);
  });
  renderPatients(filtered);
}

function savePatient() {
  alert("✅ مریض با موفقیت ثبت شد!");
  bootstrap.Modal.getInstance(document.getElementById('patientModal')).hide();
  renderPatients(patients);
}

function editPatient(id) { alert(`ویرایش مریض ${id}`); }
function viewHistory(id) { alert(`سابقه طبی مریض ${id}`); }

// شروع
renderPatients(patients);
</script>
</body>
</html>
