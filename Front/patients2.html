<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مریضان - کلینیک دندانپزشکی</title>
  <script>document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('theme') || 'light')</script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    .patient-row:hover {
      background: rgba(37, 99, 235, .08) !important;
      transition: all 0.3s ease;
    }
  </style>
</head>
<body class="p-4">

  <div class="header-gradient p-4 rounded-4 mb-4 text-center">
    <h2 class="mb-1 fw-bold">👥 مدیریت مریضان</h2>
    <p class="mb-0">کلینیک دندانپزشکی • افغانستان</p>
  </div>

  <div class="glass-card p-4 mb-4">
    <div class="row g-3 align-items-center">
      <div class="col-md-5">
        <input type="text" id="searchInput" class="form-control form-control-lg" 
               placeholder="جستجو نام، تخلص، شماره تماس یا کد مریض..." onkeyup="filterPatients()">
      </div>
      <div class="col-md-3">
        <select class="form-select form-select-lg" id="genderFilter" onchange="filterPatients()">
          <option value="">همه جنسیت‌ها</option>
          <option value="male">مذکر</option>
          <option value="female">مونث</option>
        </select>
      </div>
      <div class="col-md-4">
        <button class="btn btn-success btn-lg w-100" data-bs-toggle="modal" data-bs-target="#patientModal" onclick="openNewPatient()">
          <i class="bi bi-plus-circle"></i> ثبت مریض جدید
        </button>
      </div>
    </div>
  </div>

  <!-- جدول مریضان -->
  <div class="glass-card p-4">
    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead>
          <tr>
            <th>کد مریض</th>
            <th>نام و تخلص</th>
            <th>شماره تماس</th>
            <th>جنسیت</th>
            <th>تاریخ تولد</th>
            <th>آخرین ویزیت</th>
            <th>عملیات</th>
          </tr>
        </thead>
        <tbody id="patientsBody"></tbody>
      </table>
    </div>
  </div>

  <!-- Modal ثبت / ویرایش مریض -->
  <div class="modal fade" id="patientModal" tabindex="-1">
    <div class="modal-dialog modal-xl">
      <div class="modal-content glass-card">
        <div class="modal-header header-gradient">
          <h5 class="modal-title fw-bold" id="modalTitle">ثبت مریض جدید</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4">
          <form id="patientForm">
            <input type="hidden" id="edit_id">
            <div class="row g-4">
              <div class="col-md-3">
                <label class="form-label fw-bold">کد مریض</label>
                <input type="text" class="form-control" id="patient_code" placeholder="M-24001">
              </div>
              <div class="col-md-4">
                <label class="form-label fw-bold">نام</label>
                <input type="text" class="form-control" id="first_name" required>
              </div>
              <div class="col-md-5">
                <label class="form-label fw-bold">تخلص</label>
                <input type="text" class="form-control" id="last_name" required>
              </div>

              <div class="col-md-4">
                <label class="form-label fw-bold">شماره تماس</label>
                <input type="tel" class="form-control" id="phone" placeholder="07xxxxxxxx" required>
              </div>
              <div class="col-md-4">
                <label class="form-label fw-bold">تذکره / کد ملی</label>
                <input type="text" class="form-control" id="national_id">
              </div>
              <div class="col-md-4">
                <label class="form-label fw-bold">تاریخ تولد</label>
                <input type="date" class="form-control" id="date_of_birth">
              </div>

              <div class="col-md-4">
                <label class="form-label fw-bold">جنسیت</label>
                <select class="form-select" id="gender">
                  <option value="male">مذکر</option>
                  <option value="female">مونث</option>
                </select>
              </div>

              <div class="col-12">
                <label class="form-label fw-bold">آدرس</label>
                <input type="text" class="form-control" id="address" placeholder="ولایت، ناحیه، سرک...">
              </div>

              <div class="col-12">
                <label class="form-label fw-bold">آلرژی و سابقه طبی</label>
                <textarea class="form-control" id="medical_notes" rows="3"></textarea>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">انصراف</button>
          <button type="button" class="btn btn-success px-5" onclick="savePatient()">ذخیره</button>
        </div>
      </div>
    </div>
  </div>

<script src="assets/js/app.js"></script>
<script src="assets/js/auth.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
// داده نمونه
let patients = [
  {id:1, code:"M-24001", first_name:"محمد", last_name:"رحیمی", phone:"0785123456", gender:"male", dob:"1365-04-12", last_visit:"۱۴۰۳/۰۲/۲۰", national_id:"", address:"", medical_notes:""},
  {id:2, code:"M-24002", first_name:"فاطمه", last_name:"احمدی", phone:"0791234567", gender:"female", dob:"1370-11-12", last_visit:"۱۴۰۳/۰۲/۲۵", national_id:"", address:"", medical_notes:""},
  {id:3, code:"M-24003", first_name:"احمد", last_name:"خان", phone:"0779988776", gender:"male", dob:"1368-02-02", last_visit:"۱۴۰۳/۰۲/۱۸", national_id:"", address:"", medical_notes:""},
];

let editMode = false;

function renderPatients(data) {
  const tbody = document.getElementById('patientsBody');
  tbody.innerHTML = data.map(p => `
    <tr class="patient-row">
      <td><strong>${esc(p.code)}</strong></td>
      <td>${esc(p.first_name)} ${esc(p.last_name)}</td>
      <td dir="ltr">${esc(p.phone)}</td>
      <td>${p.gender === 'male' ? '👨 مذکر' : '👩 مونث'}</td>
      <td>${p.dob}</td>
      <td>${p.last_visit}</td>
      <td>
        <button class="btn btn-sm btn-outline-primary me-1" onclick="editPatient(${p.id})">
          <i class="bi bi-pencil"></i> ویرایش
        </button>
        <button class="btn btn-sm btn-outline-danger me-1" onclick="deletePatient(${p.id})">
          <i class="bi bi-trash"></i> حذف
        </button>
        <button class="btn btn-sm btn-outline-info" onclick="viewHistory(${p.id})">
          سابقه
        </button>
      </td>
    </tr>
  `).join('');
}

function filterPatients() {
  const search = document.getElementById('searchInput').value.toLowerCase().trim();
  const gender = document.getElementById('genderFilter').value;

  const filtered = patients.filter(p => {
    const fullName = (p.first_name + " " + p.last_name).toLowerCase();
    return (fullName.includes(search) || p.phone.includes(search) || p.code.toLowerCase().includes(search)) &&
           (!gender || p.gender === gender);
  });
  renderPatients(filtered);
}

// باز کردن مدال برای ثبت جدید
function openNewPatient() {
  editMode = false;
  document.getElementById('modalTitle').textContent = 'ثبت مریض جدید';
  document.getElementById('patientForm').reset();
  document.getElementById('edit_id').value = '';
}

// ویرایش مریض
function editPatient(id) {
  const patient = patients.find(p => p.id === id);
  if (!patient) return;

  editMode = true;
  document.getElementById('modalTitle').textContent = 'ویرایش مریض';
  document.getElementById('edit_id').value = patient.id;
  document.getElementById('patient_code').value = patient.code;
  document.getElementById('first_name').value = patient.first_name;
  document.getElementById('last_name').value = patient.last_name;
  document.getElementById('phone').value = patient.phone;
  document.getElementById('national_id').value = patient.national_id || '';
  document.getElementById('date_of_birth').value = patient.dob;
  document.getElementById('gender').value = patient.gender;
  document.getElementById('address').value = patient.address || '';
  document.getElementById('medical_notes').value = patient.medical_notes || '';

  new bootstrap.Modal(document.getElementById('patientModal')).show();
}

// ذخیره (ثبت یا ویرایش)
function savePatient() {
  const id = document.getElementById('edit_id').value;
  const data = {
    code: document.getElementById('patient_code').value,
    first_name: document.getElementById('first_name').value,
    last_name: document.getElementById('last_name').value,
    phone: document.getElementById('phone').value,
    national_id: document.getElementById('national_id').value,
    dob: document.getElementById('date_of_birth').value,
    gender: document.getElementById('gender').value,
    address: document.getElementById('address').value,
    medical_notes: document.getElementById('medical_notes').value,
    last_visit: new Date().toLocaleDateString('fa-IR')
  };

  if (editMode && id) {
    // ویرایش
    const index = patients.findIndex(p => p.id == id);
    if (index !== -1) {
      patients[index] = { ...patients[index], ...data };
      alert("✅ اطلاعات مریض با موفقیت ویرایش شد!");
    }
  } else {
    // ثبت جدید
    const newId = patients.length > 0 ? Math.max(...patients.map(p => p.id)) + 1 : 1;
    patients.push({ id: newId, ...data });
    alert("✅ مریض جدید با موفقیت ثبت شد!");
  }

  bootstrap.Modal.getInstance(document.getElementById('patientModal')).hide();
  renderPatients(patients);
}

// حذف مریض
function deletePatient(id) {
  if (confirm("آیا مطمئن هستید که می‌خواهید این مریض را حذف کنید؟")) {
    patients = patients.filter(p => p.id !== id);
    renderPatients(patients);
    alert("✅ مریض با موفقیت حذف شد!");
  }
}

// سابقه
function viewHistory(id) {
  alert(`مشاهده سابقه مریض شماره ${id}`);
}

// شروع
renderPatients(patients);
</script>
</body>
</html>
