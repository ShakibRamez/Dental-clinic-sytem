<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/css/style.css">
    <title>Loading....</title>
    <style>
        .load{
            color: #999;
            text-align: center;
            margin-top: 17%;
            font-size: 92px;
            transform: translateX(-100%);
            transition: transform 0.4s ease-in;
        }
        .show {
            transform: translateX(0);
        }
    </style>
</head>
<body style="background-color: #eee;">

    <h1 class="load">Loading System....</h1>
    
    <script src="./assets/js/auth.js"></script>
    <script>
        const userName = sessionStorage.getItem("user_name");

        async function getRole(userName) {
            const users = await getUsers()
            const role = users.find(u => {
                return u.username === userName;
            })                        
            return role
        }

        setTimeout(() => document.querySelector('.load').classList.add('show'), 100);

        async function name() {
            if(((await getRole(userName)).role).toLowerCase() === "amin") 
                setTimeout(() => window.location.href = "/index", 1000);
            else if(((await getRole(userName)).role).toLowerCase() === "admin") 
                setTimeout(() => window.location.href = "/prescriptions", 1000);
        }
        name()
    </script>
</body>
</html>
