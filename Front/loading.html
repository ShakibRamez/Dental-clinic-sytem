<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>در حال آماده‌سازی…</title>
  <script>document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('theme') || 'light')</script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/style.css">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; color: #e6f4f3; overflow: hidden; text-align: center; padding: 20px;
      background: radial-gradient(800px 500px at 50% 0%, rgba(45,212,191,.28), transparent 60%), linear-gradient(160deg, #0a2a2e, #0e4247 60%, #0b3a40); }
    .wrap { max-width: 440px; width: 100%; animation: fadeIn .6s ease both; }
    .orb { position: relative; width: 120px; height: 120px; margin: 0 auto 28px; display: grid; place-items: center; }
    .orb i { font-size: 3rem; color: #5eead4; position: relative; z-index: 2; animation: beat 1.4s ease-in-out infinite; }
    .orb .core { position: absolute; inset: 22px; border-radius: 50%; background: rgba(255,255,255,.1); backdrop-filter: blur(6px); z-index: 1; }
    .ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(94,234,212,.55); animation: ripple 2.4s ease-out infinite; }
    .ring:nth-child(2) { animation-delay: .8s } .ring:nth-child(3) { animation-delay: 1.6s }
    @keyframes ripple { from { transform: scale(.55); opacity: .9; } to { transform: scale(1.7); opacity: 0; } }
    @keyframes beat { 0%,100% { transform: scale(1); } 15% { transform: scale(1.18); } 30% { transform: scale(1); } 45% { transform: scale(1.12); } }
    .bar { height: 6px; border-radius: 99px; background: rgba(255,255,255,.12); overflow: hidden; margin: 22px 0 18px; }
    .bar > span { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, #2dd4bf, #5eead4, #99f6e4); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; transition: width .6s ease; }
    @keyframes shimmer { to { background-position: -200% 0; } }
    .steps { text-align: start; display: inline-block; }
    .step { display: flex; align-items: center; gap: 10px; padding: 5px 0; opacity: .4; transition: opacity .4s, transform .4s; transform: translateX(8px); }
    .step.on { opacity: 1; transform: none; }
    .step .dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid rgba(255,255,255,.3); display: grid; place-items: center; font-size: .8rem; transition: .3s; }
    .step:not(.done) .dot i { opacity: 0; }
    .step.done .dot { background: #2dd4bf; border-color: #2dd4bf; color: #04201c; }
    .step.on:not(.done) .dot { border-color: #5eead4; border-top-color: transparent; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .tip { margin-top: 26px; font-size: .88rem; color: #9ccfca; min-height: 2.6em; transition: opacity .4s; }
    .foot { position: fixed; bottom: 16px; inset-inline: 0; font-size: .8rem; opacity: .6; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="orb"><span class="ring"></span><span class="ring"></span><span class="ring"></span><span class="core"></span><i class="bi bi-heart-pulse-fill"></i></div>
    <h3 class="fw-bold mb-1" id="hello">خوش آمدید</h3>
    <p class="mb-0" style="color:#9ccfca">در حال آماده‌سازی سیستم…</p>
    <div class="bar"><span id="prog"></span></div>
    <div class="steps">
      <div class="step" id="s1"><span class="dot"><i class="bi bi-check-lg"></i></span>تأیید هویت و نقش کاربری</div>
      <div class="step" id="s2"><span class="dot"><i class="bi bi-check-lg"></i></span>بارگذاری تنظیمات کلینیک</div>
      <div class="step" id="s3"><span class="dot"><i class="bi bi-check-lg"></i></span>آماده‌سازی داشبورد</div>
    </div>
    <div class="tip" id="tip"></div>
  </div>
  <div class="foot" id="foot"></div>

<script src="./assets/js/app.js"></script>
<script src="./assets/js/auth.js"></script>
<script>
  const $ = id => document.getElementById(id);
  $('hello').textContent = AF.greeting() + '، ' + getCurrentUser();
  $('foot').textContent = AF.long() + ' • ' + AF.time() + ' (وقت کابل)';

  const tips = ['با دکمهٔ منوی کناری می‌توانید فهرست را جمع کنید.', 'تاریخ‌ها در این سیستم به تقویم هجری شمسی افغانی نمایش داده می‌شوند.',
    'از تم تیره برای کار شبانه استفاده کنید.', 'نسخه‌ها و فاکتورها را می‌توانید مستقیم چاپ کنید.', 'هر شب ساعت ۲۳:۴۵ نسخهٔ پشتیبان گرفته می‌شود.'];
  let ti = 0; const tip = $('tip'); tip.textContent = tips[0];
  setInterval(() => { tip.style.opacity = 0; setTimeout(() => { tip.textContent = tips[++ti % tips.length]; tip.style.opacity = 1; }, 350); }, 2600);

  const wait = ms => new Promise(r => setTimeout(r, ms));
  async function step(id, pct, work) {
    $(id).classList.add('on'); $('prog').style.width = pct + '%';
    const out = await Promise.all([work ? work().catch(() => null) : null, wait(650)]);
    $(id).classList.add('done'); return out[0];
  }
  (async () => {
    if (sessionStorage.getItem('isLoggedIn') !== 'true') return;   // auth.js به لاگین برمی‌گرداند
    const role = await step('s1', 30, getCurrentRole);
    await step('s2', 65, () => wait(200));
    await step('s3', 100, () => wait(100));
    await wait(350);
    document.body.style.transition = 'opacity .4s'; document.body.style.opacity = 0;
    await wait(380);
    // دکتر مستقیم به نسخه‌نویسی می‌رود؛ بقیه به داشبورد
    location.href = role && role.includes('doctor') ? '/index#prescriptions' : '/index';
  })();
</script>
</body>
</html>
