<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>500 - خطای داخلی سرور</title>
  <script>document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('theme') || 'light')</script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="./assets/css/error.css">
</head>
<body class="err" style="--tone: #dc2626">
  <div class="orbs"><span></span><span></span></div>
  <main class="err-card" role="main">
    <div class="err-icon"><i class="bi bi-bug"></i></div>
    <div class="err-code">500</div>
    <h3 class="err-title">خطای داخلی سرور</h3>
    <p class="err-text">مشکلی در سمت سرور پیش آمد. این خطا از شما نیست؛ لطفاً چند لحظه بعد دوباره تلاش کنید.</p>

    <div class="err-actions"><button class="btn btn-primary" onclick="location.reload()"><i class="bi bi-arrow-clockwise"></i> تلاش دوباره</button><button class="btn btn-outline-secondary" onclick="copyId()"><i class="bi bi-clipboard"></i> کپی شناسهٔ خطا</button><a class="btn btn-outline-secondary" href="index.html"><i class="bi bi-house"></i> صفحهٔ اصلی</a></div>
    <div class="err-meta">
      <span><i class="bi bi-calendar3"></i> <span id="when"></span></span>
      <span><i class="bi bi-link-45deg"></i> <code id="path"></code></span>
      <span><i class="bi bi-hash"></i> شناسهٔ خطا: <code id="eid"></code></span>
    </div>
  </main>
<script src="./assets/js/app.js"></script>
<script>
  const $ = id => document.getElementById(id);
  $('when').textContent = AF.long() + ' • ' + AF.time();
  $('path').textContent = location.pathname;
  const id = 'E' + Date.now().toString(36).toUpperCase().slice(-6); $('eid').textContent = id;
  function copyId() { navigator.clipboard?.writeText(id); toast('شناسه کپی شد', 'success'); }
</script>
</body>
</html>
