<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>400 - درخواست نامعتبر است</title>
  <script>document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('theme') || 'light')</script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="./assets/css/error.css">
</head>
<body class="err" style="--tone: #d97706">
  <div class="orbs"><span></span><span></span></div>
  <main class="err-card" role="main">
    <div class="err-icon"><i class="bi bi-exclamation-diamond"></i></div>
    <div class="err-code">400</div>
    <h3 class="err-title">درخواست نامعتبر است</h3>
    <p class="err-text">سرور نتوانست درخواست شما را بفهمد. ممکن است اطلاعات ارسال‌شده ناقص یا نادرست باشد. صفحه را دوباره باز کنید و تلاش کنید.</p>

    <div class="err-actions"><button class="btn btn-primary" onclick="history.back()"><i class="bi bi-arrow-right"></i> بازگشت</button><a class="btn btn-outline-secondary" href="index.html"><i class="bi bi-house"></i> صفحهٔ اصلی</a></div>
    <div class="err-meta">
      <span><i class="bi bi-calendar3"></i> <span id="when"></span></span>
      <span><i class="bi bi-link-45deg"></i> <code id="path"></code></span>
      
    </div>
  </main>
<script src="./assets/js/app.js"></script>
<script>
  const $ = id => document.getElementById(id);
  $('when').textContent = AF.long() + ' • ' + AF.time();
  $('path').textContent = location.pathname;

</script>
</body>
</html>
